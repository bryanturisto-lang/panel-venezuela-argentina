  // ======================================================
  // ASISTENTE DE LEADS (simulado)
  // ------------------------------------------------------
  // En el panel real el texto y la captura van a una función del servidor
  // que llama a Claude con herramientas (buscar el lead, consultar el cupo,
  // reportar erróneo, registrar gestión). Claude nunca actúa solo: propone,
  // el asesor confirma y el servidor vuelve a validar todo. Aquí las mismas
  // decisiones salen de reglas de texto, para poder ver el flujo.
  // ======================================================
  const asis = { leadId: null, mensajes: [], pendiente: null, esperandoLead: null, adjunto: null, ocupado: false };
  let focoAntesAsistente = null;
  const SUGERENCIAS = ['El número no existe', 'Dice que no pidió información', 'Es un lead repetido', 'No me contesta', 'Ya compró con otra agencia', '¿Cuántos reportes me quedan?'];
  const sinAcentos = (t) => String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

  function clasificar(texto) {
    const t = sinAcentos(texto);
    if (/cuantos|me quedan|limite|cupo de report/.test(t)) return { tipo: 'cupo' };
    if (/no existe|no tiene whats|numero (malo|equivocado|invalido|errado)|no entra|fuera de servicio|no sale la llamada|no le llega|mal escrito/.test(t)) return { tipo: 'erroneo', motivo: 'numero_invalido' };
    if (/no (pidio|solicito|lleno|dejo sus datos)|nunca pidio|no sabe (de|por) que|no se registro/.test(t)) return { tipo: 'erroneo', motivo: 'no_solicito' };
    if (/repetid|duplicad|ya (era|es) cliente|ya lo (tengo|atendi)|mismo cliente|ya me lo (dieron|asignaron)/.test(t)) return { tipo: 'erroneo', motivo: 'duplicado' };
    if (/otra ruta|otro pais|es de (venezuela|argentina|espana|colombia)|no es de (esta|mi) ruta/.test(t)) return { tipo: 'erroneo', motivo: 'otra_ruta' };
    if (/falso|de prueba|broma|inventad|datos raros/.test(t)) return { tipo: 'erroneo', motivo: 'datos_falsos' };
    if (/no (me )?contesta|no responde|no atiende|me deja en visto|en visto|no me escribe|no lee/.test(t)) return { tipo: 'no_contesta' };
    if (/ya compro|otra agencia|no le interesa|muy caro|cambio de planes|ya no viaja/.test(t)) return { tipo: 'perdido', motivo: /otra agencia|ya compro/.test(t) ? 'Ya compró con otra agencia' : /caro/.test(t) ? 'El precio no le sirvió' : /planes|no viaja/.test(t) ? 'Cambió de planes' : 'Otro' };
    return { tipo: 'desconocido' };
  }
  function misLeadsAbiertos() {
    return datos.leads.filter(l => l.asesorId === yo().id && esHoy(l.asignado) && !['cerrado', 'perdido', 'erroneo'].includes(l.estado))
      .sort((a, b) => b.asignado - a.asignado);
  }
  function buscarLeadEnTexto(texto) {
    const t = sinAcentos(texto), digitos = texto.replace(/\D/g, '');
    const candidatos = misLeadsAbiertos().filter(l => {
      const partes = sinAcentos(l.cliente).split(/\s+/).filter(p => p.length > 2);
      if (partes.some(p => new RegExp('\\b' + p + '\\b').test(t))) return true;
      if (digitos.length >= 4 && l.tel.replace(/\D/g, '').endsWith(digitos)) return true;
      return new RegExp('\\b' + sinAcentos(codigo(l.origen)) + '\\b').test(t) && new RegExp('\\b' + sinAcentos(codigo(l.destino)) + '\\b').test(t);
    });
    return candidatos.length === 1 ? candidatos[0] : null;
  }
  const fichaLead = (l) => '<span class="ficha">' + rutaHtml(l) + '<br>' + esc(l.cliente) + ' · ' + esc(telVisible(l.tel)) + ' · ' + esc(NOMBRE_ESTADO[l.estado]) + '</span>';

  function decir(texto, extra) { asis.mensajes.push(Object.assign({ quien: 'bot', texto }, extra || {})); pintarChat(); }
  function pintarChat() {
    const cont = $('#asisChat');
    cont.innerHTML = asis.mensajes.map(m => '<div class="msg ' + m.quien + '">' + esc(m.texto) +
      (m.adjunto ? '<span class="ficha">Captura adjunta: ' + esc(m.adjunto) + '</span>' : '') +
      (m.lead && leadPorId(m.lead) ? fichaLead(leadPorId(m.lead)) : '') +
      (m.acciones && m.acciones.length ? '<span class="acciones-msg">' + m.acciones.map(a =>
        '<button type="button" class="btn btn-chico' + (a.secundario ? ' btn-sec' : '') + (a.peligro ? ' btn-peligro' : '') + '" data-accion="' + a.accion + '"' +
        (a.valor != null ? ' data-valor="' + esc(a.valor) + '"' : '') + (a.id != null ? ' data-id="' + esc(a.id) + '"' : '') +
        (m.cerrado ? ' disabled' : '') + '>' + esc(a.etiqueta) + '</button>').join('') + '</span>' : '') + '</div>').join('') +
      (asis.ocupado ? '<div class="msg bot" aria-label="El asistente está escribiendo"><span class="escribiendo"><i></i><i></i><i></i></span></div>' : '');
    cont.scrollTop = cont.scrollHeight;
    const l = asis.leadId ? leadPorId(asis.leadId) : null;
    $('#asisContexto').textContent = l ? 'Hablando del lead ' + codigo(l.origen) + ' a ' + codigo(l.destino) + ' · ' + l.cliente : 'Cuéntame qué pasó con un lead';
    $('#asisSugerencias').innerHTML = SUGERENCIAS.map(s => '<button type="button" class="chip" data-accion="asis-sugerencia" data-valor="' + esc(s) + '">' + esc(s) + '</button>').join('');
    const adj = $('#asisAdjunto');
    adj.classList.toggle('oculto', !asis.adjunto);
    adj.innerHTML = asis.adjunto ? 'Captura lista: <b>' + esc(asis.adjunto.name) + '</b> <button type="button" class="btn btn-sec btn-chico" data-accion="asis-quitar-adjunto">Quitar</button>' : '';
  }
  // Cierra los botones de un mensaje viejo para que no se pueda confirmar dos veces.
  const cerrarOpciones = () => asis.mensajes.forEach(m => { if (m.acciones) m.cerrado = true; });

  function abrirAsistente(leadId) {
    if (rol !== 'asesor') return;
    const panel = $('#asistente');
    if (!panel.classList.contains('abierto')) focoAntesAsistente = document.activeElement;
    const nuevoLead = leadId ? Number(leadId) : null;
    if (nuevoLead && nuevoLead !== asis.leadId) {
      asis.leadId = nuevoLead; asis.pendiente = null; asis.esperandoLead = null; cerrarOpciones();
      const l = leadPorId(nuevoLead);
      decir('Hablemos de este lead. ¿Qué pasó? Si es erróneo lo reporto y pido la reposición; si no contesta, te dejo el seguimiento.', { lead: l.id });
    } else if (!asis.mensajes.length) {
      decir('Hola, ' + yo().nombre.split(' ')[0] + '. Cuéntame qué pasó con un lead (puedes nombrar al cliente, la ruta o el teléfono). Si el lead es erróneo lo reporto y te asigno la reposición; si no contesta, te programo el seguimiento.');
    }
    panel.classList.add('abierto'); panel.setAttribute('aria-hidden', 'false');
    $('#fabAsistente').classList.add('oculto');
    pintarChat();
    setTimeout(() => $('#asisTexto').focus(), 60);
  }
  function cerrarAsistente() {
    const panel = $('#asistente');
    if (!panel.classList.contains('abierto')) return;
    panel.classList.remove('abierto'); panel.setAttribute('aria-hidden', 'true');
    $('#fabAsistente').classList.toggle('oculto', rol !== 'asesor');
    if (focoAntesAsistente && document.contains(focoAntesAsistente)) focoAntesAsistente.focus();
  }
  function reiniciarAsistente() {
    Object.assign(asis, { leadId: null, mensajes: [], pendiente: null, esperandoLead: null, adjunto: null, ocupado: false });
    cerrarAsistente();
  }

  function enviarAlAsistente(texto) {
    texto = String(texto || '').trim();
    if ((!texto && !asis.adjunto) || asis.ocupado) return;
    cerrarOpciones();
    asis.mensajes.push({ quien: 'yo', texto: texto || '(captura)', adjunto: asis.adjunto ? asis.adjunto.name : null });
    if (asis.adjunto) asis.adjuntoEnviado = asis.adjunto;
    asis.adjunto = null;
    asis.ocupado = true; pintarChat();
    const espera = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 650;
    setTimeout(() => { asis.ocupado = false; responder(texto); }, espera);
  }

  function responder(texto) {
    // Llega solo una captura y había un reporte esperándola.
    if (!texto && asis.pendiente && asis.pendiente.faltaCaptura) { asis.pendiente.faltaCaptura = false; revisarYProponer(asis.pendiente); return; }
    if (!texto) { decir('Recibí la captura. Ahora cuéntame qué pasó con el lead y la uso como prueba.'); return; }
    const intencion = texto ? clasificar(texto) : { tipo: 'desconocido' };
    if (intencion.tipo === 'cupo') {
      const c = cupoLE(yo().id);
      decir('Hoy recibiste ' + c.recibidos + ' leads y llevas ' + c.usados + ' reportes de erróneos. Te quedan ' + c.quedan + ' de ' + c.limite + '. ' + textoReglaLE());
      return;
    }
    if (intencion.tipo === 'desconocido') {
      decir('No te entendí del todo. Dime qué pasó en pocas palabras, por ejemplo: “el número no existe”, “es repetido” o “no me contesta”. También puedes elegir una de las opciones de abajo.');
      return;
    }
    let l = (texto && buscarLeadEnTexto(texto)) || (asis.leadId ? leadPorId(asis.leadId) : null);
    if (!l) {
      const abiertos = misLeadsAbiertos().slice(0, 6);
      if (!abiertos.length) { decir('No tienes leads abiertos hoy sobre los que pueda hacer eso.'); return; }
      asis.esperandoLead = Object.assign({ texto }, intencion);
      decir('¿De qué lead hablas?', { acciones: abiertos.map(x => ({ accion: 'asis-elegir-lead', id: x.id, etiqueta: codigo(x.origen) + ' ' + codigo(x.destino) + ' · ' + x.cliente.split(' ')[0], secundario: true })) });
      return;
    }
    asis.leadId = l.id;
    preparar(Object.assign({ texto }, intencion), l);
  }

  function preparar(intencion, l) {
    const detalle = intencion.texto && intencion.texto.length >= 8 ? intencion.texto : (MOTIVOS_LE[intencion.motivo] || intencion.texto || '');
    if (intencion.tipo === 'erroneo') {
      const yaReportado = datos.reportes.some(r => r.leadId === l.id && r.estado !== 'anulado');
      if (yaReportado) { decir('Este lead ya está reportado como erróneo. Lo puedes seguir en la sección Leads erróneos.', { lead: l.id }); return; }
      if (l.fuente === 'propio') { decir('Es un lead que reportaste tú, así que no cuenta en tu cupo ni tiene reposición. Si no sirve, márcalo como perdido.', { lead: l.id, acciones: [{ accion: 'asis-perdido-directo', valor: 'Datos no válidos', etiqueta: 'Marcar como perdido', secundario: true }] }); return; }
      if (['perdido', 'cerrado'].includes(l.estado)) {
        decir('Este lead ya está como “' + NOMBRE_ESTADO[l.estado] + '”, así que no se puede reportar como erróneo.', { lead: l.id });
        return;
      }
      if (l.estado !== 'nuevo' || l.comprobante || l.contactadoEn) {
        decir('Este lead ya está contactado, así que no se puede reportar como erróneo: se reporta antes de subir el comprobante. Si no sirve, márcalo como perdido.', { lead: l.id });
        return;
      }
      const c = cupoLE(yo().id);
      if (c.quedan === 0) {
        decir('Ya usaste tus ' + c.limite + ' reportes de hoy, así que no lo puedo reportar. Si de verdad es erróneo, avisa a supervisión para que lo revise a mano.', { lead: l.id });
        return;
      }
      const p = { tipo: 'erroneo', leadId: l.id, motivo: intencion.motivo, detalle, faltaCaptura: false, captura: asis.adjuntoEnviado ? asis.adjuntoEnviado.name : null, archivo: asis.adjuntoEnviado || null };
      if ((datos.ajustes.exigirCaptura || iaObligatoria()) && !p.captura) {
        p.faltaCaptura = true; asis.pendiente = p;
        decir('Entendido: “' + MOTIVOS_LE[p.motivo] + '”. Para reportarlo necesito la captura del chat o de la llamada como prueba. Adjúntala con el clip y la reviso.', { lead: l.id, acciones: [{ accion: 'asis-adjuntar', etiqueta: 'Adjuntar captura' }] });
        return;
      }
      revisarYProponer(p); return;
    }
    if (intencion.tipo === 'no_contesta') {
      decir('Que no conteste no lo hace erróneo: puede estar ocupado o no haber visto el mensaje. Vuelve a escribirle en un par de horas. Los recordatorios automáticos llegan en la fase 2.', { lead: l.id }); return;
    }
    if (intencion.tipo === 'perdido') {
      proponer({ tipo: 'perdido', leadId: l.id, motivo: intencion.motivo, detalle: intencion.texto }); return;
    }
  }

  // Antes de proponer un reporte, la IA mira la captura (la misma revisión que el formulario).
  function revisarYProponer(p) {
    const l = leadPorId(p.leadId);
    if (!p.captura && asis.adjuntoEnviado) { p.captura = asis.adjuntoEnviado.name; p.archivo = asis.adjuntoEnviado; }
    if (!iaObligatoria() || p.ia || !p.archivo) { proponer(p); return; }
    asis.pendiente = p; asis.ocupado = true; pintarChat();
    verificarCaptura(l, p.motivo, p.detalle, p.archivo).then(ia => {
      asis.ocupado = false; p.ia = ia;
      decir(ia.veredicto === 'confirma'
        ? 'Revisé la captura: ' + ia.explicacion + (ia.loQueMuestra ? '\nLo que se ve: ' + ia.loQueMuestra : '')
        : ia.veredicto === 'error' ? 'No pude revisar la captura: ' + ia.explicacion
        : 'Revisé la captura y no puedo confirmarlo: ' + ia.explicacion + (ia.loQueMuestra ? '\nLo que se ve: ' + ia.loQueMuestra : ''));
      proponer(p);
    });
  }

  function proponer(p) {
    const l = leadPorId(p.leadId);
    asis.pendiente = p;
    if (p.tipo === 'erroneo' && p.ia && p.ia.veredicto !== 'confirma') {
      decir('Si lo envío así, queda en revisión de supervisión: el cupo se te devuelve cuando lo aprueben. Si tienes una captura mejor, mándamela y la reviso otra vez.',
        { lead: l.id, acciones: [{ accion: 'asis-confirmar', etiqueta: 'Enviar a supervisión' }, { accion: 'asis-otra-captura', etiqueta: 'Mandar otra captura', secundario: true }, { accion: 'asis-cancelar', etiqueta: 'No, déjalo', secundario: true }] });
      return;
    }
    if (p.tipo === 'erroneo') {
      const c = cupoLE(yo().id);
      if (!p.captura && asis.adjuntoEnviado) { p.captura = asis.adjuntoEnviado.name; p.archivo = asis.adjuntoEnviado; }
      const despues = datos.ajustes.modoLE === 'revision'
        ? 'Supervisión lo revisa y, cuando lo apruebe, te llega la reposición.'
        : (enTurno(yo().id) ? 'En menos de un minuto se te devuelve el cupo y el reparto te asigna otro lead.' : 'Se te devuelve el cupo, pero la reposición te llega cuando te registres en el turno.');
      decir('Voy a reportar este lead como erróneo por “' + MOTIVOS_LE[p.motivo] + '”' + (p.captura ? ', con la captura que mandaste' : '') + '. Te quedarían ' + (c.quedan - 1) + ' de ' + c.limite + ' reportes hoy. ' + despues + '\n¿Lo confirmo?',
        { lead: l.id, acciones: [{ accion: 'asis-confirmar', etiqueta: 'Sí, repórtalo', peligro: true }, { accion: 'asis-cancelar', etiqueta: 'No, déjalo', secundario: true }] });
    } else if (p.tipo === 'no_contesta') {

        { lead: l.id, acciones: [{ accion: 'asis-confirmar', etiqueta: 'Sí, regístralo' }, { accion: 'asis-cancelar', etiqueta: 'No', secundario: true }] });

  }

  async function confirmarPendiente() {
    const p = asis.pendiente; if (!p) return;
    const l = leadPorId(p.leadId); if (!l) return;
    asis.pendiente = null; asis.adjuntoEnviado = null; cerrarOpciones();
    if (p.tipo === 'erroneo') {
      // Se vuelve a comprobar justo antes de actuar; el servidor lo valida otra vez.
      if (cupoLE(yo().id).quedan === 0 || datos.reportes.some(r => r.leadId === l.id && r.estado !== 'anulado') || l.estado !== 'nuevo' || l.comprobante) {
        decir('No pude reportarlo: algo cambió desde que lo propuse (cupo agotado, ya reportado o el lead ya está contactado).'); return;
      }
      asis.ocupado = true; pintarChat();
      try {
        const r = await crearReporteLE(l, p.motivo, p.detalle, p.archivo, p.ia);
        decir(r.estado === 'en_revision' ? 'Listo, lo envié a supervisión. Cuando lo aprueben se te devuelve el cupo y te llega la reposición.'
          : (miTurno() ? 'Listo, quedó reportado. El reparto te devuelve el cupo en el próximo minuto y te asigna la reposición.' : 'Listo, quedó reportado. Se te devuelve el cupo; la reposición te llega cuando te registres en el turno.'));
      } catch (e) {
        decir('No pude reportarlo: ' + mensajeError(e));
      } finally { asis.ocupado = false; pintarChat(); }
    } else if (p.tipo === 'perdido') {
      asis.ocupado = true; pintarChat();
      try { await marcarPerdido(l); decir('Hecho, quedó como perdido. Sale de tus activos y queda en el historial.'); }
      catch (e) { decir('No pude marcarlo: ' + mensajeError(e)); }
      finally { asis.ocupado = false; pintarChat(); }
    }
  }
  async function marcarPerdido(l) {
    await cambiarEstado(l, 'perdido');
    repintar();
  }

  // ======================================================
  // PINTADO GENERAL
  // ======================================================
  // ---- Repintado sin parpadeo ----
  // Antes cada recarga en vivo borraba y volvía a crear toda la pantalla: parpadeo, hover perdido,
  // desplegables cerrados, foco y scroll perdidos. Ahora se compara con lo que ya hay y solo se
  // cambia lo distinto (textos, atributos y los elementos que de verdad cambiaron).
  function mismoNodo(x, y) {
    if (x.nodeType !== y.nodeType || x.nodeName !== y.nodeName) return false;
    if (x.nodeType !== 1) return true;
    return (x.id || '') === (y.id || '') && (x.getAttribute('data-id') || '') === (y.getAttribute('data-id') || '') &&
      (x.getAttribute('type') || '') === (y.getAttribute('type') || '') && (x.getAttribute('name') || '') === (y.getAttribute('name') || '');
  }
  function igualarAtributos(x, y) {
    for (const at of Array.from(x.attributes)) {
      if (y.hasAttribute(at.name)) continue;
      if (at.name === 'open' && x.nodeName === 'DETAILS') continue;      // lo abrió la persona: se respeta
      x.removeAttribute(at.name);
    }
    for (const at of Array.from(y.attributes)) if (x.getAttribute(at.name) !== at.value) x.setAttribute(at.name, at.value);
    if (x.nodeName === 'INPUT' && x !== document.activeElement && x.type !== 'file') {
      if (x.type === 'checkbox' || x.type === 'radio') x.checked = y.hasAttribute('checked');
      else { const v = y.getAttribute('value') || ''; if (x.value !== v) x.value = v; }
    }
  }
  // Clave de una tarjeta (lead, reporte, asesor): permite moverla en vez de rehacerla cuando entra una nueva arriba.
  const claveDe = (n) => n.nodeType === 1 ? (n.id ? '#' + n.id : n.getAttribute('data-id') ? n.nodeName + '|' + (n.getAttribute('data-accion') || '') + '|' + n.getAttribute('data-id') : null) : null;
  function igualarHijos(viejo, nuevo) {
    const a = viejo.childNodes, b = Array.from(nuevo.childNodes);
    const porClave = new Map(), clavesNuevas = new Set();
    for (const n of Array.from(a)) { const k = claveDe(n); if (k && !porClave.has(k)) porClave.set(k, n); }
    for (const n of b) { const k = claveDe(n); if (k) clavesNuevas.add(k); }
    for (let i = 0; i < b.length; i++) {
      const nb = b[i];
      let na = a[i];
      const k = claveDe(nb);
      if (k && (!na || claveDe(na) !== k)) {
        const igual = porClave.get(k);
        if (igual && igual.parentNode === viejo && mismoNodo(igual, nb)) { viejo.insertBefore(igual, na || null); na = igual; }
      }
      if (!na) { viejo.appendChild(nb); continue; }
      if (!mismoNodo(na, nb)) {
        // Si la tarjeta que está aquí sigue haciendo falta más abajo, la nueva entra delante (no la pisa).
        const kv = claveDe(na);
        if (kv && clavesNuevas.has(kv)) viejo.insertBefore(nb, na); else viejo.replaceChild(nb, na);
        continue;
      }
      if (na.nodeType !== 1) { if (na.nodeValue !== nb.nodeValue) na.nodeValue = nb.nodeValue; continue; }
      igualarAtributos(na, nb);
      if (na.nodeName === 'TEXTAREA') { if (na !== document.activeElement && na.value !== nb.value) na.value = nb.value; continue; }
      igualarHijos(na, nb);
      if (na.nodeName === 'SELECT' && na !== document.activeElement) {
        const elegida = nb.querySelector('option[selected]'); const v = elegida ? elegida.value : (na.options[0] && na.options[0].value);
        if (v != null && na.value !== v) na.value = v;
      }
    }
    while (a.length > b.length) viejo.removeChild(viejo.lastChild);
  }
  function pintarEn(el, html) {
    if (!el) return;
    if (!el.firstChild) { el.innerHTML = html; return; }
    const molde = document.createElement('template'); molde.innerHTML = html;
    igualarHijos(el, molde.content);
  }
  // Para cambiar "x.innerHTML = ..." por "suave(x).innerHTML = ..." sin reescribir cada pintado.
  const suave = (el) => ({ set innerHTML(html) { pintarEn(el, html); } });

  let ultimaSeccion = null, quitarEntrada = null;
  function repintar() {
    pintarNavegacion();
    const id = seccionActual();
    const vista = $('#vista');
    if (id !== ultimaSeccion) {
      // Sección nueva: se pinta de cero y entra con una animación suave (una sola vez).
      ultimaSeccion = id; vista.innerHTML = VISTAS[id]();
      vista.classList.remove('entrando'); void vista.offsetWidth; vista.classList.add('entrando');
      clearTimeout(quitarEntrada); quitarEntrada = setTimeout(() => vista.classList.remove('entrando'), 600);
    } else {
      suave(vista).innerHTML = VISTAS[id]();

    if (id === 'ajustes') pintarPreviaLE();

        registrarseEnTurno(val ? [val] : null); break;
      case 'pausa': cambiarPausa(val, b.dataset.modo); break;

      case 'rol-asignador': {
        const u = datos.usuarios.find(x => x.id === b.dataset.id); if (!u || u.id === miId || rol !== 'asignador') break;

          (hacer ? 'Podrá anotar y sacar asesores del turno, asignar rutas, bloquear, retirar, pausar el reparto y revisar los leads erróneos. Si tiene ruta, sigue atendiendo leads como siempre.'

          const { data, error } = await sb.from('asesores').update({ es_asignador: hacer }).eq('id', u.id).select('id');

  // ---- Turno: primero la hoja de reparto (Apps Script), después Supabase ----
  // La hoja decide a quién le llegan leads; registros_turno es el espejo que lee el panel.
  async function registrarseEnTurno(soloRutas) {
    const u = yo(), t = turnoActual();
    if (!t) { avisar('El registro está cerrado ahora. ' + textoHorario(), 'err'); return; }
    const pendientes = rutasPorRegistrar(u, t).filter(r => !soloRutas || soloRutas.includes(r));
    const cerradas = soloRutas ? [] : rutasSinAbrir(u);
    if (cerradas.length) avisar('El turno de ' + nombreRutas(cerradas) + ' todavía no abre (desde las ' + cerradas.map(r => hhmm(APERTURA_AM[r])).join(' y ') + '). Te registro en ' + (pendientes.length ? nombreRutas(pendientes) : 'nada por ahora') + '.');
    if (!pendientes.length) { recargar(50); return; }
    registrandoTurno = true; repintar();
    const res = await Promise.all(pendientes.map(async (r) => {
      try {
        const resp = await llamarAppsScript({ action: 'registrar', nombre: u.nombre }, r);
        const msg = (resp && resp.message) || '';
        if (resp && resp.success === false && !/ya est[aá]s registrad/i.test(msg)) {
          const porCupo = resp.bloqueadoPorTope === true || /l[ií]mite de leads|cupo|tope de \d+ leads|completaste tus/i.test(msg);
          return { r, error: porCupo ? 'Ya completaste tu cupo de leads de hoy en ' + RUTAS[r] + '.' : (msg || 'La hoja no aceptó el registro.') };
        }
        const { error } = await sb.from('registros_turno').insert({ asesor_id: u.id, fecha: hoyClave(), turno: t, ruta: r }).select();
        if (error && error.code !== '23505') return { r, error: 'Quedaste anotado en la hoja de ' + RUTAS[r] + ', pero el panel no lo guardó: ' + mensajeError(error) };
        return { r };
      } catch (e) { return { r, error: 'No se pudo contactar la hoja de ' + RUTAS[r] + ': ' + mensajeError(e) }; }
    }));
    registrandoTurno = false;
    const bien = res.filter(x => !x.error), mal = res.filter(x => x.error);
    if (bien.length) avisar('Quedaste en la lista de reparto de ' + nombreRutas(bien.map(x => x.r)) + '.');
    mal.forEach(x => avisar(x.error, 'err'));
    await recargarYa();
    consultarMiCupo(); consultarOrdenHoja();
  }

    const u = yo(), t = turnoActual();
    const mios = u.registros.filter(r => !t || r.turno === t);
    for (const reg of mios) {
      const resp = await llamarAppsScript({ action: 'quitar', nombre: u.nombre }, reg.ruta);

    }

    const candidatos = todosLosAsesores().filter(u => u.estado === 'activo' && u.rutas.length && faltaEn(u).length).sort((a, b) => a.nombre.localeCompare(b.nombre));
    if (!candidatos.length) { avisar('Todos los asesores activos con ruta ya están en el turno ' + t + '.'); return; }
    const casillas = (u) => faltaEn(u).map(r => '<label class="opcion"><input type="checkbox" name="ruta" value="' + r + '" checked><span>' + esc(RUTAS[r]) + '</span></label>').join('');
    abrirModal('<form class="formulario" novalidate><h2 id="modalTitulo">Anotar en el turno ' + t + '</h2>' +
      '<p>Se anota primero en la hoja de reparto de cada ruta (con eso ya recibe leads) y después en el panel.</p>' +
      '<label class="campo"><span>Asesor</span><select class="entrada" name="asesor" required>' +
      candidatos.map(u => '<option value="' + u.id + '">' + esc(u.nombre) + (u.rol === 'asignador' ? ' (asignador)' : '') + '</option>').join('') + '</select></label>' +
      '<fieldset><legend class="campo"><span>Rutas</span></legend><div class="opciones" id="rutasAnotar">' + casillas(candidatos[0]) + '</div></fieldset>' +
      '<p class="error-campo oculto" role="alert"></p>' + botonesModal('Anotar en el turno') + '</form>', async (form) => {

      const rutas = Array.from(form.querySelectorAll('input[name="ruta"]:checked')).map(x => x.value);
      if (!rutas.length) return marcarError(form, 'asesor', 'Marca al menos una ruta.');
      const res = [];
      for (const r of rutas) {                     // de una en una: cada hoja usa un candado
        try {
          const resp = await llamarAppsScript({ action: 'registrar', nombre: u.nombre }, r);
          const msg = (resp && resp.message) || '';
          if (resp && resp.success === false && !/ya est[aá]s? registrad/i.test(msg)) {
            const porCupo = resp.bloqueadoPorTope === true || /l[ií]mite de leads|cupo|tope de \d+ leads|complet/i.test(msg);
            res.push({ r, error: porCupo ? u.nombre + ' ya completó su cupo de hoy en ' + RUTAS[r] + '.' : 'La hoja de ' + RUTAS[r] + ' no lo aceptó: ' + (msg || 'sin motivo') });
            continue;
          }
          const { error } = await sb.from('registros_turno').insert({ asesor_id: u.id, fecha: hoyClave(), turno: t, ruta: r }).select();
          if (error && error.code !== '23505') {
            res.push({ r, error: /row-level security|permission|42501/i.test((error.message || '') + error.code)
              ? 'Quedó en la hoja de ' + RUTAS[r] + ' (ya recibe leads), pero el panel no tiene permiso para anotarlo: falta correr el SQL 05.'
              : 'Quedó en la hoja de ' + RUTAS[r] + ', pero el panel no lo guardó: ' + mensajeError(error) });
            continue;
          }
          res.push({ r });
        } catch (e) { res.push({ r, error: 'No se pudo contactar la hoja de ' + RUTAS[r] + ': ' + mensajeError(e) }); }
      }
      const bien = res.filter(x => !x.error);
      if (bien.length) avisar(u.nombre + ' quedó en el turno ' + t + ' de ' + nombreRutas(bien.map(x => x.r)) + '.');
      res.filter(x => x.error).forEach(x => avisar(x.error, 'err'));

  // Cupo de leads del día que lleva el asesor en cada hoja.
  async function consultarMiCupo() {
    if (!(rol === 'asesor' || (rol === 'asignador' && yo().rutas.length))) return;
    const u = yo();
    await Promise.all(u.rutas.map(async (r) => {
      try {

        const c = resp && resp.porRuta ? (resp.porRuta[r] || Object.values(resp.porRuta)[0]) : null;
        if (c && typeof c.leads === 'number') miCupo[r] = Object.assign({}, c, { detalle: resp.detalleCupo || '' }); else delete miCupo[r];
      } catch (e) { delete miCupo[r]; }

  }
  // Pausa del reparto: se leen todas las hojas de los grupos (una petición a la vez por script).
  const objetivosPausa = () => { const vistos = {}; return GRUPOS_PAUSA.flatMap(g => g.objetivos).filter(o => !vistos[clavePausa(o)] && (vistos[clavePausa(o)] = true)); };
  const estadoDePausa = (resp) => resp && typeof resp.pausado === 'boolean' ? { pausado: resp.pausado, automatica: !!resp.automatica, hasta: resp.hasta || '' } : { error: true };
  const leerPausa = async (o) => { try { return estadoDePausa(await llamarAppsScript({ action: 'estadoPausa', grupo: o.grupo }, o.ruta)); } catch (e) { return { error: true }; } };
  async function consultarPausa() {
    if (rol !== 'asignador' || pausaOcupada) return;
    const gen = generacionPausa, objetivos = objetivosPausa();
    const res = await Promise.all(objetivos.map(leerPausa));
    if (pausaOcupada || gen !== generacionPausa) return;          // lectura vieja: se descarta
    objetivos.forEach((o, i) => { pausa[clavePausa(o)] = res[i]; });
    if (seccionActual() === 'inicio' && !$('#modal').classList.contains('abierto')) repintar();
  }
  async function cambiarPausa(idGrupo, accion) {
    const g = GRUPOS_PAUSA.find(x => x.id === idGrupo);
    if (!g || pausaOcupada || rol !== 'asignador' || !['pausar', 'reanudar'].includes(accion)) return;
    const quiere = accion === 'pausar';
    pausaOcupada = g.id; generacionPausa++; repintar();
    const fallan = [];
    try {
      for (const o of g.objetivos) {
        const p = pausa[clavePausa(o)];
        if (p && !p.error && p.pausado === quiere && !p.automatica) continue;   // esa hoja ya está así
        try { await llamarAppsScript({ action: accion, grupo: o.grupo, por: yo().nombre }, o.ruta); } catch (e) { /* se confirma leyendo */ }
      }
      // La escritura a veces se completa aunque la respuesta no llegue: lo que vale es lo que dice la hoja después.
      for (const o of g.objetivos) {
        const p = await leerPausa(o); pausa[clavePausa(o)] = p;
        if (p.error || p.pausado !== quiere) fallan.push(o.etiqueta);
      }
    } finally { pausaOcupada = ''; generacionPausa++; }
    if (fallan.length) avisar('No se pudo confirmar en: ' + fallan.join(', ') + '. Revisa el estado y vuelve a intentarlo.', 'err');
    else avisar(g.titulo + ': ' + (quiere ? 'reparto en pausa.' : 'reparto reanudado.'));
    repintar();
  }

    const p = $('.error-campo', form);
    const fallo = (m) => { p.textContent = m; p.style.color = ''; p.classList.remove('oculto'); };
    if (!correo || !clave) return fallo('Escribe tu correo y tu contraseña.');
    const boton = form.querySelector('button[type="submit"]'); boton.disabled = true;
    try {
      if (modoAcceso === 'crear') {
        const nombre = form.nombre.value.trim();
        if (nombre.split(/\s+/).length < 2) { fallo('Escribe tu nombre y apellido, como aparece en la hoja de reparto.'); return; }
        const { data, error } = await sb.auth.signUp({ email: correo, password: clave, options: { data: { nombre } } });
        if (error) { fallo(traducirError(error.message)); return; }
        if (data.user && data.user.identities && data.user.identities.length === 0) { fallo('Ese correo ya tiene cuenta. Entra con él.'); return; }
        if (!data.session) { modoAcceso = 'entrar'; pintarAcceso('Cuenta creada. Confirma tu correo con el enlace que te llegó y después entra.', 'ok'); }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email: correo, password: clave });
        if (error) fallo(traducirError(error.message));
      }
    } catch (e) { fallo(traducirError(e.message)); }
    finally { if (document.contains(boton)) boton.disabled = false; }
  }

  async function cargarOCrearPerfil(user) {
    for (let i = 0; i < 3; i++) {
      const { data, error } = await sb.from('asesores').select('*').eq('id', user.id).maybeSingle();
      if (data) return data;
      if (error && i === 2) throw error;
      await new Promise(r => setTimeout(r, 1500));   // normalmente un trigger crea la fila al registrarse
    }
    const nombre = (user.user_metadata && user.user_metadata.nombre) || (user.email || '').split('@')[0];
    const { data, error } = await sb.from('asesores').insert({ id: user.id, nombre }).select('*').maybeSingle();
    if (data) return data;
    if (error && error.code === '23505') { const r = await sb.from('asesores').select('*').eq('id', user.id).maybeSingle(); if (r.data) return r.data; }
    throw error || new Error('No se pudo crear tu perfil.');
  }

  let entradaEnCurso = null;
  function entrarAlPanel(user) {
    if (miId === user.id) return Promise.resolve();
    if (entradaEnCurso && entradaEnCurso.id === user.id) return entradaEnCurso.promesa;
    const promesa = (async () => {
      try {
        const perfil = await cargarOCrearPerfil(user);
        if ((perfil.bloqueado || perfil.retirado) && !perfil.es_asignador) {
          await sb.auth.signOut();
          pintarAcceso(perfil.retirado ? 'Tu cuenta ya no está activa en el equipo.' : 'Tu cuenta está bloqueada. Habla con tu asignadora.');
          return;
        }
        miId = perfil.id;
        rol = perfil.es_asignador ? 'asignador' : perfil.es_supervisor ? 'supervisor' : 'asesor';
        filtrosLeads.estado = 'activos'; filtrosLeads.asesor = '';
        await cargarDatos();
        document.body.classList.remove('sin-sesion');
        repintar();
        conectarTiempoReal();
        consultarMiCupo(); consultarPausa(); consultarOrdenHoja();
        temporizadores.push(setInterval(() => recargar(0), 60000));
        temporizadores.push(setInterval(consultarMiCupo, 120000));
        temporizadores.push(setInterval(consultarPausa, 120000));
        temporizadores.push(setInterval(consultarOrdenHoja, 120000));
        try { if (window.Notification && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {}
      } catch (e) {
        console.error(e);
        miId = null;
        pintarAcceso('No se pudo cargar el panel: ' + mensajeError(e));
      } finally { entradaEnCurso = null; }
    })();
    entradaEnCurso = { id: user.id, promesa };
    return promesa;
  }
  function conectarTiempoReal() {
    // Dos canales, igual que el panel actual: si el de reportes falla, el de leads sigue.
    canales.push(sb.channel('turisto-v2-en-vivo')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'leads' }, () => recargar(500))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'registros_turno' }, () => { recargar(800); consultarOrdenLuego(); })
      .subscribe());
    canales.push(sb.channel('turisto-v2-erroneos')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'reportes_erroneos' }, () => recargar(500))
      .subscribe());
  }
  function salirDelPanel(mensaje) {
    canales.forEach(c => { try { sb.removeChannel(c); } catch (e) {} }); canales = [];
    temporizadores.forEach(clearInterval); temporizadores = [];
    clearTimeout(recargaPendiente);
    miId = null; rol = 'asesor'; datos = datosVacios(); idsConocidos = null;
    Object.keys(miCupo).forEach(k => delete miCupo[k]); Object.keys(ordenHoja).forEach(k => delete ordenHoja[k]); Object.keys(periodos).forEach(k => delete periodos[k]);
    Object.keys(faltanEnHoja).forEach(k => delete faltanEnHoja[k]); Object.keys(candidatosFalta).forEach(k => delete candidatosFalta[k]); clearTimeout(segundaLectura); Object.keys(pausa).forEach(k => delete pausa[k]);
    cerrarModal(); cerrarCajon(); cerrarAsistente(); reiniciarAsistente();
    document.body.classList.add('sin-sesion');
    modoAcceso = 'entrar'; pintarAcceso(mensaje);
  }
  async function cerrarSesion() {
    try { const { error } = await sb.auth.signOut(); if (error) await sb.auth.signOut({ scope: 'local' }); }
    catch (e) { try { await sb.auth.signOut({ scope: 'local' }); } catch (e2) {} }
    salirDelPanel();
  }
  async function recargarYa() { clearTimeout(recargaPendiente); try { await cargarDatos(); } catch (e) { console.error(e); } repintar(); }

  // La burbuja superior se compacta al bajar.
  const barra = $('#barra');
  const ajustarBarra = () => barra.classList.toggle('compacta', window.scrollY > 8);
  window.addEventListener('scroll', ajustarBarra, { passive: true }); ajustarBarra();
  document.body.classList.add('sin-sesion');
  if (!sb) {
    pintarAcceso('No cargó la conexión con Supabase. Revisa el internet y recarga la página.');
  } else {
    pintarAcceso();
    // Sin await dentro del callback: supabase-js se bloquea si se espera aquí (igual que en el panel actual).
    sb.auth.onAuthStateChange((evento, sesion) => {
      setTimeout(() => { if (sesion && sesion.user) entrarAlPanel(sesion.user); else if (miId) salirDelPanel(); }, 0);
    });
  }
})();
</script>
