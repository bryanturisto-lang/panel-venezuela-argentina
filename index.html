<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turisto · Panel de Asesores</title>
<meta name="theme-color" content="#4C45A4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===================== TOKENS ===================== */
  :root {
    color-scheme: light;
    --noche: #F6F5FC;        /* fondo de la página: blanco con un toque lavanda */
    --tinta: #FFFFFF;        /* tarjetas */
    --tinta-2: #F8F7FE;      /* superficies dentro de tarjetas */
    --linea: #DAD5F1;
    --linea-suave: #ECE9F8;
    --violeta: #4C45A4;      /* morado Turisto: estructura y estado activo */
    --violeta-2: #5D55C4;
    --violeta-claro: #5F57C7;/* marcas de datos sobre blanco */
    --lavanda: #EFEDFB;      /* fondos suaves de hover y selección */
    --lima: #D8E369;         /* amarillo Turisto: "esto te toca ahora" (relleno) */
    --sobre-lima: #26240A;
    --lima-tinta: #5E6600;   /* amarillo Turisto como texto sobre blanco (contraste AA) */
    --coral: #D63F2A;        /* alertas */
    --ambar: #A86400;
    --menta: #12895A;
    --niebla: #1E1A3D;       /* texto principal (morado muy oscuro, nunca negro) */
    --niebla-2: #4F4874;
    --niebla-3: #6E6896;
    --sombra: 0 24px 48px -24px rgba(60, 50, 140, .35);
    --sombra-suave: 0 1px 2px rgba(76, 69, 164, .06), 0 10px 28px -16px rgba(76, 69, 164, .28);
    --r-s: 8px; --r-m: 14px; --r-l: 22px;
    --t: 180ms cubic-bezier(.2, .8, .3, 1);
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; scroll-behavior: smooth; }
  ::selection { background: color-mix(in srgb, var(--lima) 70%, #fff); color: var(--niebla); }
  * { scrollbar-width: thin; scrollbar-color: #CFC9EE transparent; }
  body {
    margin: 0; background: var(--noche); color: var(--niebla);
    font: 15px/1.5 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .num, .ruta-cod { font-family: 'Space Grotesk', 'Inter', sans-serif; }
  h1 { font-size: 26px; line-height: 1.15; margin: 0; letter-spacing: -.4px; }
  h2 { font-size: 18px; margin: 0; letter-spacing: -.2px; }
  h3 { font-size: 15px; margin: 0; }
  p { margin: 0; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--violeta) 55%, transparent); outline-offset: 2px; border-radius: 8px; }
  .oculto { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .num { font-variant-numeric: tabular-nums; }
  .tenue { color: var(--niebla-2); }
  .muy-tenue { color: var(--niebla-3); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

  /* ===================== CONTROLES BASE ===================== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; text-decoration: none;
    border: 1px solid transparent; border-radius: 10px; padding: 9px 16px;
    font-weight: 600; font-size: 14px; background: var(--violeta); color: #fff;
    transition: filter var(--t), background var(--t), border-color var(--t);
  }
  .btn:hover { filter: brightness(1.12); }
  .btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
  .btn-sec { background: transparent; color: var(--niebla); border-color: var(--linea); }
  .btn-sec:hover { border-color: var(--niebla-3); filter: none; }
  .btn-lima { background: var(--lima); color: var(--sobre-lima); }
  .btn-peligro { background: transparent; color: var(--coral); border-color: color-mix(in srgb, var(--coral) 45%, transparent); }
  .btn-peligro:hover { background: color-mix(in srgb, var(--coral) 12%, transparent); filter: none; }
  .btn-chico { min-height: 32px; padding: 5px 12px; font-size: 13px; border-radius: 8px; }
  .btn-icono { width: 38px; height: 38px; padding: 0; border-radius: 10px; background: transparent; border: 1px solid var(--linea); color: var(--niebla-2); }
  .btn-icono:hover { color: var(--niebla); border-color: var(--niebla-3); }
  .btn-icono svg { width: 18px; height: 18px; }

  .chip {
    display: inline-flex; align-items: center; gap: 6px; border-radius: 999px;
    padding: 6px 12px; font-size: 13px; font-weight: 500;
    border: 1px solid var(--linea); background: transparent; color: var(--niebla-2);
  }
  .chip:hover { color: var(--niebla); }
  .chip[aria-pressed="true"] { background: var(--violeta); border-color: var(--violeta); color: #fff; }
  .chip .cuenta { font-size: 12px; opacity: .8; }

  .campo { display: flex; flex-direction: column; gap: 6px; }
  .campo > span, .campo legend { font-size: 13px; font-weight: 600; color: var(--niebla-2); }
  .entrada, select.entrada, textarea.entrada {
    width: 100%; border: 1px solid var(--linea); background: var(--noche); border-radius: 10px;
    padding: 10px 12px; font-size: 14px; outline: none; transition: border-color var(--t);
  }
  textarea.entrada { min-height: 84px; resize: vertical; }
  .entrada:focus { border-color: var(--violeta-claro); }
  .entrada[aria-invalid="true"] { border-color: var(--coral); }
  .ayuda { font-size: 12.5px; color: var(--niebla-3); }
  .error-campo { font-size: 12.5px; color: var(--coral); }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }

  /* ===================== ESTRUCTURA ===================== */
  .marco { display: grid; grid-template-columns: 252px minmax(0, 1fr); grid-template-rows: auto 1fr; min-height: 100vh; }

  /* La burbuja superior: logo, ruta, buscador y usuario. Se compacta al bajar. */
  .barra {
    grid-column: 1 / -1; position: sticky; top: 12px; z-index: 30; margin: 12px 20px 0;
    display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 10px 12px 10px 22px; border-radius: 999px;
    background: linear-gradient(105deg, #433C98 0%, var(--violeta) 45%, #5B52C2 100%); color: #fff;
    box-shadow: 0 14px 34px -18px rgba(60, 50, 150, .75), inset 0 1px 0 rgba(255, 255, 255, .14);
    transition: box-shadow var(--t);
  }
  .barra.compacta { box-shadow: 0 18px 40px -14px rgba(60, 50, 150, .9), inset 0 1px 0 rgba(255, 255, 255, .14); }
  .marca { display: inline-flex; align-items: center; flex: none; padding: 4px 6px; margin-right: 6px; border-radius: 12px; transition: transform var(--t); }
  .marca:hover { transform: scale(1.04); }
  .logo { height: 26px; width: auto; display: block; }
  .barra .segmentado { border-color: rgba(255, 255, 255, .22); background: rgba(255, 255, 255, .08); border-radius: 999px; }
  .barra .segmentado button { color: rgba(255, 255, 255, .82); border-radius: 999px; transition: background var(--t), color var(--t); }
  .barra .segmentado button:hover { color: #fff; background: rgba(255, 255, 255, .12); }
  .barra .segmentado button[aria-pressed="true"] { background: var(--lima); color: var(--sobre-lima); box-shadow: 0 4px 12px -6px rgba(0, 0, 0, .35); }
  .barra .buscador input { background: #fff; border-color: transparent; border-radius: 999px; color: var(--niebla); }
  .barra .buscador input::placeholder { color: var(--niebla-3); }
  .barra .buscador input:focus { border-color: var(--lima); box-shadow: 0 0 0 3px color-mix(in srgb, var(--lima) 55%, transparent); }
  .barra .btn-icono { color: #fff; border-color: rgba(255, 255, 255, .28); background: rgba(255, 255, 255, .06); border-radius: 999px; }
  .barra .btn-icono:hover { background: rgba(255, 255, 255, .16); border-color: rgba(255, 255, 255, .5); color: #fff; }
  .barra :focus-visible { outline-color: var(--lima); }
  .barra .usuario .quien span { color: rgba(255, 255, 255, .78); }
  .barra .avatar { background: var(--lima); color: var(--sobre-lima); box-shadow: 0 0 0 3px rgba(255, 255, 255, .18); }

  .lateral {
    position: sticky; top: 92px; height: calc(100vh - 104px); overflow-y: auto; margin: 16px 0 12px 20px;
    background: var(--tinta); border: 1px solid var(--linea-suave); border-radius: var(--r-l); box-shadow: var(--sombra-suave);
    padding: 14px 12px; display: flex; flex-direction: column; gap: 18px;
  }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-grupo { font-size: 12px; font-weight: 600; color: var(--niebla-3); padding: 18px 12px 6px; }
  .nav a {
    display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 8px 12px; border-radius: 10px;
    text-decoration: none; color: var(--niebla-2); font-weight: 500; font-size: 14.5px;
    transition: background var(--t), color var(--t);
  }
  .nav a svg { width: 18px; height: 18px; flex: none; opacity: .85; }
  .nav a:hover { color: var(--violeta); background: var(--lavanda); transform: translateX(2px); }
  .nav a { transition: background var(--t), color var(--t), transform var(--t), box-shadow var(--t); }
  .nav a[aria-current="page"] { color: #fff; background: var(--violeta); font-weight: 600; box-shadow: 0 8px 18px -10px rgba(76, 69, 164, .9); transform: none; }
  .nav a[aria-current="page"] svg { opacity: 1; color: var(--lima); }
  .nav .contador-nav { margin-left: auto; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 8px; background: var(--coral); color: #fff; }
  .turno-lateral { margin-top: auto; border: 0; border-radius: var(--r-m); padding: 14px; font-size: 13px; background: linear-gradient(160deg, var(--lavanda), color-mix(in srgb, var(--lima) 22%, #fff)); }
  .turno-lateral .estado { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--niebla-3); flex: none; }
  .punto.ok { background: var(--menta); box-shadow: 0 0 0 4px color-mix(in srgb, var(--menta) 18%, transparent); }
  .punto.alerta { background: var(--coral); }

  .principal { min-width: 0; display: flex; flex-direction: column; }
  .segmentado { display: inline-flex; border: 1px solid var(--linea); border-radius: 11px; padding: 3px; gap: 2px; }
  .segmentado button { border: 0; background: transparent; color: var(--niebla-2); border-radius: 8px; min-height: 32px; padding: 5px 13px; font-size: 13.5px; font-weight: 600; }
  .segmentado button[aria-pressed="true"] { background: var(--tinta-2); color: var(--niebla); }
  .buscador { position: relative; flex: 1; max-width: 360px; }
  .buscador svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--niebla-3); }
  .buscador input { padding-left: 34px; }
  .usuario { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none;
    background: var(--violeta); color: #fff; font: 700 13px 'Space Grotesk', sans-serif;
  }
  .usuario .quien { line-height: 1.2; text-align: right; }
  .usuario .quien b { display: block; font-size: 14px; }
  .usuario .quien span { font-size: 12.5px; color: var(--niebla-3); }
  .menu-movil { display: none; }

  /* Margen abajo para que el botón flotante del asistente no tape lo último de la página */
  .vista { padding: 32px 36px 120px; max-width: 1280px; width: 100%; }
  .cabeza { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
  .cabeza h1 { font-size: 28px; }
  .cabeza .sub { color: var(--niebla-2); margin-top: 8px; max-width: 66ch; font-size: 15px; }
  .cabeza .acciones { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
  .bloque { border: 1px solid var(--linea-suave); background: var(--tinta); border-radius: var(--r-l); padding: 22px; }
  .bloque > header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; min-height: 32px; }
  .bloque > header h2 { font-size: 16px; }
  .bloque > header .acciones { margin-left: auto; display: flex; gap: 8px; }
  .bloque > header .acciones .btn { white-space: nowrap; }
  .bloque-desc { color: var(--niebla-2); font-size: 14px; margin: -8px 0 16px; max-width: 70ch; }
  .rejilla-inicio { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 22px; align-items: start; }
  .columna { display: flex; flex-direction: column; gap: 22px; }

  /* ===================== CIFRAS DEL DÍA ===================== */
  .cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: var(--linea-suave); border: 1px solid var(--linea-suave); border-radius: var(--r-l); overflow: hidden; margin-bottom: 22px; }
  .cifra { background: var(--tinta); padding: 16px 18px; display: flex; flex-direction: column; gap: 2px; }
  .cifra .num { font-size: 26px; font-weight: 700; line-height: 1.15; }
  .cifra span:last-child { font-size: 13px; color: var(--niebla-2); }

  /* ===================== EL PASE (lead) ===================== */
  .lista-pases { display: flex; flex-direction: column; gap: 8px; }
  .pase {
    position: relative; display: grid; grid-template-columns: 5px 178px minmax(0, 1fr) minmax(0, 210px) 150px; align-items: center; gap: 0 18px;
    width: 100%; min-height: 72px; text-align: left; border: 1px solid var(--linea-suave); background: var(--tinta-2);
    border-radius: var(--r-m); padding: 12px 18px 12px 0; overflow: hidden; color: inherit;
    transition: border-color var(--t), transform var(--t), background var(--t);
  }
  .pase:hover { border-color: var(--linea); background: color-mix(in srgb, var(--tinta-2) 80%, var(--violeta) 8%); }
  .pase .marcas-col { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--niebla-2); min-width: 0; }
  .pase .marcas-col .alerta { color: var(--coral); font-weight: 600; }
  .pase .marcas-col .hoy { color: var(--lima-tinta); font-weight: 600; }
  .pase .estado-col { justify-self: end; }
  /* Donde la lista es angosta (p. ej. Inicio con la columna lateral) las alertas
     pasan debajo del nombre en vez de ocupar una columna propia. */
  .lista-pases { container: pases / inline-size; }
  @container pases (max-width: 820px) {
    .pase { grid-template-columns: 5px 168px minmax(0, 1fr) auto; grid-template-areas: "f r q e" "f r m e"; row-gap: 6px; }
    .pase .franja { grid-area: f; grid-row: 1 / -1; }
    .pase .ruta-bloque { grid-area: r; }
    .pase .quien { grid-area: q; }
    .pase .marcas-col { grid-area: m; flex-direction: row; flex-wrap: wrap; gap: 2px 14px; }
    .pase .marcas-col:empty { display: none; }
    .pase .estado-col { grid-area: e; }
  }
  .pase:active { transform: scale(.995); }
  .pase .franja { align-self: stretch; margin: -12px 0; background: var(--niebla-3); }
  .pase[data-estado="nuevo"] .franja { background: var(--lima); }
  .pase[data-estado="contactado"] .franja { background: var(--violeta-claro); }
  .pase[data-estado="cotizado"] .franja { background: #6A4FD6; }
  .pase[data-estado="seguimiento"] .franja { background: var(--ambar); }
  .pase[data-estado="cerrado"] .franja { background: var(--menta); }
  .pase[data-estado="erroneo"] .franja, .pase.urgente .franja { background: var(--coral); }
  .ruta { display: flex; align-items: center; gap: 6px; }
  .ruta-cod { font-size: 22px; font-weight: 700; letter-spacing: .5px; line-height: 1; }
  .trayecto { width: 46px; height: 14px; color: var(--niebla-3); flex: none; }
  .ruta-hora { display: flex; gap: 10px; font-size: 12.5px; color: var(--niebla-3); margin-top: 6px; }
  .pase .asesor-et { color: var(--niebla); font-weight: 500; }
  .pase .quien { min-width: 0; }
  .pase .quien b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pase .detalle { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--niebla-2); margin-top: 3px; }
  .marcas { display: flex; gap: 10px; font-size: 12.5px; color: var(--niebla-2); }
  .marcas .alerta { color: var(--coral); font-weight: 600; }
  .marcas .hoy { color: var(--lima-tinta); font-weight: 600; }
  .estado-et {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;
    padding: 3px 10px; border-radius: 999px; background: var(--tinta); border: 1px solid var(--linea); white-space: nowrap;
  }
  .estado-et::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .9; }
  .estado-et[data-e="nuevo"] { color: var(--lima-tinta); }
  .estado-et[data-e="contactado"] { color: var(--violeta-claro); }
  .estado-et[data-e="cotizado"] { color: #6A4FD6; }
  .estado-et[data-e="seguimiento"] { color: var(--ambar); }
  .estado-et[data-e="cerrado"] { color: var(--menta); }
  .estado-et[data-e="perdido"] { color: var(--niebla-3); }
  .estado-et[data-e="erroneo"] { color: var(--coral); }

  .vacio { border: 1px dashed var(--linea); border-radius: var(--r-m); padding: 28px 18px; text-align: center; color: var(--niebla-2); }
  .vacio b { display: block; color: var(--niebla); margin-bottom: 4px; }
  .vacio .btn { margin-top: 12px; }

  /* ===================== BARRA DE HERRAMIENTAS ===================== */
  .herramientas { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .herramientas .entrada { width: auto; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ===================== TABLERO (kanban) ===================== */
  .tablero { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
  .columna-tab { background: var(--tinta); border: 1px solid var(--linea-suave); border-radius: var(--r-m); padding: 12px; min-height: 160px; }
  .columna-tab > h3 { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 14px; }
  .columna-tab > h3 .num { margin-left: auto; color: var(--niebla-3); font-size: 13px; }
  .tarjeta {
    display: block; width: 100%; text-align: left; border: 1px solid var(--linea-suave); background: var(--tinta-2);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; color: inherit;
  }
  .tarjeta:hover { border-color: var(--linea); }
  .tarjeta .ruta-cod { font-size: 16px; }
  .tarjeta .trayecto { width: 30px; }
  .tarjeta b { display: block; font-size: 14px; margin-top: 6px; }
  .tarjeta small { color: var(--niebla-3); font-size: 12px; }

  /* ===================== TURNO ===================== */
  .turno { display: flex; flex-direction: column; gap: 12px; }
  .turno .reloj { font: 700 34px/1 'Space Grotesk', sans-serif; font-variant-numeric: tabular-nums; }
  .turno .estado-turno { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
  .rutas-turno { display: flex; gap: 6px; flex-wrap: wrap; }
  .ruta-chip { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: color-mix(in srgb, var(--violeta) 22%, transparent); color: var(--niebla); }
  .aviso-ruta { display: flex; gap: 14px; align-items: flex-start; border: 1px solid color-mix(in srgb, var(--ambar) 45%, var(--linea-suave)); background: color-mix(in srgb, var(--ambar) 7%, var(--tinta)); border-radius: var(--r-l); padding: 18px 20px; margin-bottom: 22px; }
  .aviso-ruta b { display: block; font-size: 15px; margin-bottom: 4px; }
  .turno-cta { display: flex; align-items: center; gap: 14px 16px; flex-wrap: wrap; margin-bottom: 22px; padding: 16px 18px; border-radius: var(--r-l);
    background: linear-gradient(105deg, color-mix(in srgb, var(--lima) 30%, #fff), #fff 70%); border: 1px solid color-mix(in srgb, var(--lima) 70%, var(--linea)); box-shadow: var(--sombra-suave); }
  .turno-cta .texto { flex: 1 1 260px; min-width: 0; }
  .turno-cta b { display: block; font-size: 16px; margin-bottom: 2px; }
  .turno-cta p { color: var(--niebla-2); font-size: 14px; }
  .turno-cta .punto { width: 12px; height: 12px; align-self: flex-start; margin-top: 6px; }
  .turno-cta .btn { flex: none; }
  .opciones-registro { display: flex; gap: 8px; flex-wrap: wrap; }
  .turno .opciones-registro .btn { flex: 1 1 auto; }
  @media (max-width: 1080px) { .rejilla-inicio.es-asesor > .columna { order: -1; } }
  @media (max-width: 560px) { .turno-cta .btn { width: 100%; } }
  .aviso-hoja { border: 1px solid color-mix(in srgb, var(--ambar) 45%, var(--linea-suave)); background: color-mix(in srgb, var(--ambar) 8%, transparent); border-radius: var(--r-m); padding: 12px 14px; margin: 12px 0; font-size: 14px; }
  .aviso-hoja.rojo { border-color: color-mix(in srgb, var(--coral) 55%, var(--linea-suave)); background: color-mix(in srgb, var(--coral) 8%, transparent); }
  .aviso-hoja b { display: block; margin-bottom: 4px; }
  .aviso-hoja p { color: var(--niebla-2); margin-bottom: 10px; line-height: 1.5; }
  .aviso-hoja p:last-child { margin-bottom: 0; }
  .rango-fechas { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .mas-resultados { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .vacio.cargando b::after { content: ''; display: inline-block; width: 12px; height: 12px; margin-left: 10px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; vertical-align: -1px; animation: girar .8s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .vacio.cargando b::after { animation: none; } }
  .aviso-ruta p { color: var(--niebla-2); font-size: 14px; }
  .btn.registrando { background: color-mix(in srgb, var(--ambar) 18%, transparent); color: var(--ambar); border-color: color-mix(in srgb, var(--ambar) 55%, transparent); cursor: progress; }
  .btn.listo { background: color-mix(in srgb, var(--menta) 14%, transparent); color: var(--menta); border-color: color-mix(in srgb, var(--menta) 50%, transparent); }

  .medidor { height: 6px; border-radius: 99px; background: var(--linea-suave); overflow: hidden; }
  .medidor i { display: block; height: 100%; border-radius: 99px; background: var(--violeta-claro); }
  .medidor.lleno i { background: var(--coral); }
  .linea-dato { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--linea-suave); }
  .linea-dato:last-child { border-bottom: 0; }

  /* ===================== PANEL LATERAL DEL LEAD ===================== */
  .velo { position: fixed; inset: 0; z-index: 60; background: rgba(46, 38, 110, .28); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity var(--t); }
  .velo.abierto { opacity: 1; pointer-events: auto; }
  .cajon {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 70; width: min(560px, 100%);
    background: var(--tinta); border-left: 1px solid var(--linea); box-shadow: var(--sombra);
    display: flex; flex-direction: column; transform: translateX(104%); transition: transform 260ms cubic-bezier(.2, .8, .2, 1);
  }
  .cajon.abierto { transform: none; }
  .cajon-cab { padding: 18px 20px 14px; border-bottom: 1px solid var(--linea-suave); }
  .cajon-cab .fila { display: flex; align-items: flex-start; gap: 12px; }
  .cajon-cab .ruta-cod { font-size: 34px; }
  .cajon-cab .trayecto { width: 70px; height: 18px; }
  .cajon-cab .cerrar { margin-left: auto; }
  .cajon-cab .cliente { font-size: 17px; font-weight: 600; margin-top: 10px; }
  .cajon-cab .contacto { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; font-size: 14px; }
  .pasos { display: flex; gap: 4px; margin-top: 14px; flex-wrap: wrap; }
  .pasos button {
    flex: 1 1 auto; border: 1px solid var(--linea); background: transparent; color: var(--niebla-2);
    border-radius: 8px; padding: 7px 8px; font-size: 12.5px; font-weight: 600; min-width: 84px;
  }
  .pasos button[aria-pressed="true"] { background: var(--violeta); border-color: var(--violeta); color: #fff; }
  .pasos button.hecho { color: var(--niebla); border-color: color-mix(in srgb, var(--violeta-claro) 50%, transparent); }
  .pasos button:disabled { cursor: default; }
  .pestanas { display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid var(--linea-suave); }
  .pestanas button { border: 0; background: transparent; color: var(--niebla-2); padding: 12px 10px; font-weight: 600; font-size: 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .pestanas button[aria-selected="true"] { color: var(--niebla); border-bottom-color: var(--violeta-claro); }
  .cajon-cuerpo { flex: 1; overflow-y: auto; padding: 18px 20px 24px; }
  .cajon-pie { padding: 12px 20px; border-top: 1px solid var(--linea-suave); display: flex; gap: 8px; flex-wrap: wrap; }

  .linea-tiempo { list-style: none; margin: 0; padding: 0; }
  .linea-tiempo li { position: relative; padding: 0 0 16px 22px; }
  .linea-tiempo li::before { content: ""; position: absolute; left: 4px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--violeta-claro); }
  .linea-tiempo li::after { content: ""; position: absolute; left: 7px; top: 18px; bottom: 0; width: 2px; background: var(--linea-suave); }
  .linea-tiempo li:last-child::after { display: none; }
  .linea-tiempo .que { font-weight: 600; font-size: 14px; }
  .linea-tiempo .cuando { font-size: 12.5px; color: var(--niebla-3); }
  .linea-tiempo .nota { font-size: 14px; color: var(--niebla-2); margin-top: 2px; white-space: pre-line; }
  .formulario { display: grid; gap: 12px; }
  .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .zona-archivos {
    border: 1.5px dashed var(--linea); border-radius: var(--r-m); padding: 18px; text-align: center; color: var(--niebla-2);
    transition: border-color var(--t), background var(--t);
  }
  .zona-archivos.pide { animation: pide 1.2s ease 2; border-color: var(--coral); }
  @keyframes pide { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--coral) 25%, transparent); } }
  .zona-archivos.encima { border-color: var(--violeta-claro); background: color-mix(in srgb, var(--violeta) 10%, transparent); }
  .doc { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--linea-suave); }
  .doc:last-child { border-bottom: 0; }
  .doc .ico { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: var(--tinta-2); border: 1px solid var(--linea); font: 700 11px 'Space Grotesk', sans-serif; color: var(--niebla-2); }
  .doc b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doc small { font-size: 12.5px; color: var(--niebla-3); }
  .doc .acc { display: flex; gap: 6px; }

  /* ===================== VENTANAS ===================== */
  .modal {
    position: fixed; inset: 0; z-index: 90; display: none; align-items: center; justify-content: center; padding: 20px;
    background: rgba(46, 38, 110, .32); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  .modal.abierto { display: flex; }
  .modal .caja {
    width: min(520px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; background: var(--tinta);
    border: 1px solid var(--linea); border-radius: var(--r-l); padding: 22px; box-shadow: var(--sombra);
  }
  .modal .caja > h2 { margin-bottom: 6px; }
  .modal .caja > p { color: var(--niebla-2); margin-bottom: 16px; font-size: 14px; }
  .modal .botones { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .opciones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opcion { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--linea); border-radius: 10px; padding: 10px 12px; font-size: 14px; cursor: pointer; }
  .opcion:has(input:checked) { border-color: var(--violeta-claro); background: color-mix(in srgb, var(--violeta) 14%, transparent); }
  .opcion input { margin-top: 3px; accent-color: var(--violeta-claro); }
  .opcion small { display: block; color: var(--niebla-3); font-size: 12.5px; }
  .cupo-le { display: flex; align-items: center; gap: 12px; border-radius: 10px; padding: 10px 12px; background: var(--tinta-2); font-size: 14px; margin-bottom: 14px; }
  .cupo-le .num { font-size: 20px; font-weight: 700; }

  /* ===================== TABLAS ===================== */
  .tabla-marco { overflow-x: auto; border: 1px solid var(--linea-suave); border-radius: var(--r-m); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--niebla-3); padding: 12px 16px; background: var(--tinta); border-bottom: 1px solid var(--linea-suave); white-space: nowrap; }
  td { padding: 13px 16px; border-bottom: 1px solid var(--linea-suave); vertical-align: middle; background: var(--tinta); }
  tbody tr:hover td { background: color-mix(in srgb, var(--tinta) 88%, var(--violeta) 12%); }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; }

  /* ===================== GRÁFICO DE BARRAS (estadísticas) ===================== */
  .barras { display: grid; gap: 10px; }
  .barra-fila { display: grid; grid-template-columns: 150px minmax(0, 1fr) 52px; gap: 12px; align-items: center; font-size: 14px; }
  .barra-fila .nombre { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--niebla-2); }
  .barra-pista { position: relative; height: 18px; border-left: 1px solid var(--linea); }
  .barra-pista i { position: absolute; left: 0; top: 2px; bottom: 2px; border-radius: 0 4px 4px 0; background: var(--violeta-claro); }
  .barra-pista:hover i, .barra-pista:focus-visible i { filter: brightness(1.15); }
  .barra-pista .tip {
    position: absolute; left: var(--x, 50%); bottom: calc(100% + 6px); transform: translateX(-50%);
    background: var(--violeta); color: #fff; font-size: 12.5px; padding: 6px 9px; border-radius: 8px; white-space: nowrap; box-shadow: var(--sombra-suave);
    opacity: 0; pointer-events: none; transition: opacity var(--t); z-index: 5;
  }
  .barra-pista:hover .tip, .barra-pista:focus-visible .tip { opacity: 1; }
  .barra-fila .valor { text-align: right; font-weight: 600; }
  .umbral { position: absolute; top: -4px; bottom: -4px; width: 0; border-left: 1px dashed var(--niebla-3); }

  /* ===================== ASESORES Y RUTAS ===================== */
  .contador-et { font-size: 12px; font-weight: 700; padding: 1px 9px; border-radius: 999px; background: var(--lima); color: var(--sobre-lima); }
  .pendientes { border-color: color-mix(in srgb, var(--lima) 40%, var(--linea-suave)); background: linear-gradient(180deg, color-mix(in srgb, var(--lima) 6%, var(--tinta)), var(--tinta)); }
  .fila-pendiente { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 0; border-top: 1px solid var(--linea-suave); }
  .persona { display: flex; gap: 12px; align-items: center; min-width: 0; flex: 1 1 220px; }
  .persona b { display: flex; align-items: center; gap: 8px; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .persona small { display: flex; align-items: center; gap: 7px; color: var(--niebla-3); font-size: 12.5px; margin-top: 2px; }
  .cab-asesores, .fila-asesor { display: grid; grid-template-columns: minmax(210px, 1.4fr) minmax(220px, 1.2fr) 92px 96px minmax(190px, auto); gap: 18px; align-items: center; }
  .cab-asesores { font-size: 12.5px; font-weight: 600; color: var(--niebla-3); padding: 0 0 12px; border-bottom: 1px solid var(--linea-suave); }
  .fila-asesor { padding: 14px 0; border-bottom: 1px solid var(--linea-suave); }
  .fila-asesor:last-child { border-bottom: 0; padding-bottom: 2px; }
  .fila-asesor.inactivo .persona b { color: var(--niebla-2); }
  .fila-asesor.inactivo .avatar { background: var(--linea); }
  .rutas-sel { display: flex; gap: 8px; flex-wrap: wrap; }
  .ruta-btn {
    display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--linea); background: transparent; color: var(--niebla-2);
    border-radius: 999px; padding: 6px 13px 6px 8px; font-size: 13px; font-weight: 600; transition: background var(--t), border-color var(--t), color var(--t);
  }
  .ruta-btn .caja { width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid var(--niebla-3); display: grid; place-items: center; color: transparent; }
  .ruta-btn .caja svg { width: 12px; height: 12px; }
  .ruta-btn:hover:not(:disabled) { border-color: var(--niebla-3); color: var(--niebla); }
  .ruta-btn[aria-pressed="true"] { border-color: color-mix(in srgb, var(--violeta-claro) 70%, transparent); color: var(--niebla); background: color-mix(in srgb, var(--violeta) 22%, transparent); }
  .ruta-btn[aria-pressed="true"] .caja { background: var(--violeta-claro); border-color: var(--violeta-claro); color: #fff; }
  .ruta-btn:disabled { opacity: .45; cursor: not-allowed; }
  .etiqueta-estado { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
  .etiqueta-estado.bloq { color: var(--coral); }
  .etiqueta-estado.ret { color: var(--niebla-3); }
  .sello-eq { margin-left: auto; font-size: 12.5px; font-weight: 700; padding: 3px 12px; border-radius: 999px; }
  .sello-eq.ok { background: color-mix(in srgb, var(--menta) 14%, #fff); color: var(--menta); }
  .sello-eq.duda { background: color-mix(in srgb, var(--ambar) 16%, #fff); color: var(--ambar); }
  .sello-eq.mal { background: color-mix(in srgb, var(--coral) 12%, #fff); color: var(--coral); }
  .etiqueta-estado.rol { color: var(--violeta); background: var(--lavanda); border-color: transparent; }
  .acciones-asesor { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-left: auto; }
  select.entrada.mini { width: auto; padding: 6px 28px 6px 10px; font-size: 13px; }
  .etq-m { display: none; }
  @media (max-width: 1180px) {
    .cab-asesores { display: none; }
    .fila-asesor { grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "p p p" "r t h" "a a a"; row-gap: 12px; }
    .fila-asesor .persona { grid-area: p; }
    .fila-asesor .rutas-sel { grid-area: r; }
    .fila-asesor .celda-turno { grid-area: t; }
    .fila-asesor .celda-hoy { grid-area: h; }
    .fila-asesor .acciones-asesor { grid-area: a; justify-content: flex-start; margin-left: 0; }
    .etq-m { display: inline; font-size: 12px; color: var(--niebla-3); margin-right: 6px; }
  }
  @media (max-width: 560px) {
    .fila-asesor { grid-template-columns: 1fr 1fr; grid-template-areas: "p p" "r r" "t h" "a a"; }
  }

  /* ===================== REVISIÓN DE CAPTURAS CON IA ===================== */
  .resultado-ia, .linea-ia {
    display: flex; flex-direction: column; gap: 3px; padding: 12px 14px; border-radius: 12px; font-size: 14px;
    border: 1px solid var(--linea); background: var(--tinta-2); color: var(--niebla-2);
  }
  .linea-ia { margin-top: 10px; padding: 10px 12px; font-size: 13.5px; }
  .resultado-ia b, .linea-ia b { color: var(--niebla); font-size: 14px; }
  .resultado-ia small, .linea-ia small { font-size: 12.5px; color: var(--niebla-3); }
  .resultado-ia.ok, .linea-ia.ok { border-color: color-mix(in srgb, var(--menta) 50%, transparent); background: color-mix(in srgb, var(--menta) 9%, var(--tinta-2)); }
  .resultado-ia.duda, .linea-ia.duda { border-color: color-mix(in srgb, var(--ambar) 55%, transparent); background: color-mix(in srgb, var(--ambar) 9%, var(--tinta-2)); }
  .resultado-ia.ok b::before { content: "✓ "; color: var(--menta); }
  .resultado-ia.duda b::before { content: "! "; color: var(--ambar); }
  .resultado-ia.revisando { border-style: dashed; }
  .demo-ia { margin-top: 12px; padding: 10px 12px; border: 1px dashed var(--lima); border-radius: 10px; }
  .demo-ia > span { color: var(--lima-tinta) !important; }

  /* ===================== AJUSTES ===================== */
  .modo-le { display: grid; gap: 10px; }
  .modo-le .opcion { grid-template-columns: auto 1fr; }
  .modo-le .extra { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .modo-le .extra label { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--niebla-2); }
  .modo-le .extra input { width: 76px; }
  .vista-previa { border-left: 3px solid var(--lima); padding: 8px 14px; background: var(--tinta-2); border-radius: 0 10px 10px 0; font-size: 14px; }
  .interruptor { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; }
  .interruptor input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--violeta-claro); }

  /* ===================== AVISOS ===================== */
  .avisos { position: fixed; right: 20px; bottom: 84px; z-index: 100; display: flex; flex-direction: column; gap: 8px; max-width: 360px; }
  .aviso { background: var(--tinta-2); border: 1px solid var(--linea); border-left: 4px solid var(--menta); border-radius: 10px; padding: 11px 14px; font-size: 14px; box-shadow: var(--sombra); animation: entra 220ms ease both; }
  .aviso.err { border-left-color: var(--coral); }
  @keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ===================== ASISTENTE DE LEADS ===================== */
  .fab {
    position: fixed; right: 22px; bottom: 22px; z-index: 50; display: flex; align-items: center; gap: 10px;
    border: 0; border-radius: 999px; padding: 12px 18px 12px 14px; background: var(--lima); color: var(--sobre-lima);
    font-weight: 700; font-size: 14px; box-shadow: var(--sombra);
  }
  .fab svg { width: 20px; height: 20px; }
  .fab:hover { filter: brightness(1.06); }
  .asistente {
    position: fixed; right: 22px; bottom: 22px; z-index: 85; width: min(410px, calc(100vw - 32px)); height: min(640px, calc(100vh - 70px));
    display: flex; flex-direction: column; background: var(--tinta); border: 1px solid var(--linea); border-radius: var(--r-l);
    box-shadow: var(--sombra); opacity: 0; transform: translateY(14px); pointer-events: none; visibility: hidden;
    transition: opacity var(--t), transform var(--t), visibility 0s linear 160ms;
  }
  .asistente.abierto { opacity: 1; transform: none; pointer-events: auto; visibility: visible; transition: opacity var(--t), transform var(--t); }
  .asis-cab { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--linea-suave); }
  .asis-cab h2 { font-size: 16px; }
  .marca-ia { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--lima); color: var(--sobre-lima); flex: none; }
  .marca-ia svg { width: 18px; height: 18px; }
  .asis-aviso { font-size: 12px; color: var(--niebla-3); padding: 8px 16px; border-bottom: 1px solid var(--linea-suave); }
  .asis-demo { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; color: var(--lima-tinta); }
  .asis-demo select { border: 1px dashed var(--lima); background: var(--noche); color: var(--niebla); border-radius: 6px; padding: 2px 6px; font-size: 12px; }
  .asis-chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 90%; padding: 10px 12px; border-radius: 14px; font-size: 14px; line-height: 1.45; white-space: pre-line; }
  .msg.bot { align-self: flex-start; background: var(--tinta-2); border: 1px solid var(--linea-suave); border-bottom-left-radius: 4px; }
  .msg.yo { align-self: flex-end; background: var(--violeta); color: #fff; border-bottom-right-radius: 4px; }
  .msg .ficha { display: block; margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: var(--noche); font-size: 13px; white-space: normal; }
  .msg .ficha .ruta-cod { font-size: 15px; }
  .msg .ficha .trayecto { width: 28px; height: 12px; }
  .msg .acciones-msg { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; white-space: normal; }
  .escribiendo { display: inline-flex; gap: 4px; }
  .escribiendo i { width: 6px; height: 6px; border-radius: 50%; background: var(--niebla-3); animation: punto 1s infinite ease-in-out; }
  .escribiendo i:nth-child(2) { animation-delay: .15s; } .escribiendo i:nth-child(3) { animation-delay: .3s; }
  @keyframes punto { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
  .asis-sugerencias { display: flex; gap: 6px; overflow-x: auto; padding: 0 16px 10px; scrollbar-width: thin; }
  .asis-sugerencias .chip { white-space: nowrap; flex: none; }
  .asis-adjunto { display: flex; align-items: center; gap: 8px; margin: 0 16px 8px; font-size: 13px; color: var(--niebla-2); }
  .asis-pie { display: flex; gap: 8px; align-items: flex-end; padding: 10px 12px; border-top: 1px solid var(--linea-suave); }
  .asis-pie textarea { resize: none; min-height: 42px; max-height: 120px; }

  /* ===================== MÓVIL ===================== */
  .nav-inferior { display: none; }
  @media (max-width: 1080px) {
    .rejilla-inicio { grid-template-columns: 1fr; }
  }
  @media (max-width: 900px) {
    .marco { grid-template-columns: 1fr; }
    .lateral {
      position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 80; background: var(--tinta); margin: 0;
      border-radius: 0 var(--r-l) var(--r-l) 0; transform: translateX(-104%); transition: transform 240ms ease; height: 100%; top: 0;
    }
    .lateral.abierto { transform: none; box-shadow: var(--sombra); }
    .menu-movil { display: inline-grid; }
    .barra { margin: 8px 10px 0; top: 8px; border-radius: 26px; padding: 10px 12px; gap: 10px; flex-wrap: wrap; }
    .marca { margin-right: 0; }
    .logo { height: 22px; }
    .barra .usuario { gap: 8px; }
    .buscador { order: 5; max-width: none; flex-basis: 100%; }
    .barra .segmentado { order: 4; }
    .cifra:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .cifras { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .usuario .quien { display: none; }
    .vista { padding: 18px 16px 96px; }
    .pase { grid-template-columns: 5px minmax(0, 1fr) auto; grid-template-areas: "f r e" "f q q" "f m m"; row-gap: 8px; }
    .pase .franja { grid-area: f; grid-row: 1 / -1; }
    .pase .ruta-bloque { grid-area: r; }
    .pase .quien { grid-area: q; }
    .pase .ruta-cod { font-size: 19px; }
    .pase .trayecto { width: 32px; }
    .pase .estado-col { grid-area: e; align-self: start; }
    .pase .marcas-col { grid-area: m; flex-direction: row; flex-wrap: wrap; gap: 4px 12px; }
    .pase .marcas-col:empty { display: none; }
    .nav-inferior {
      display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      background: var(--tinta); border-top: 1px solid var(--linea); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    }
    .nav-inferior a, .nav-inferior button {
      display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: none; text-decoration: none;
      color: var(--niebla-3); font-size: 11.5px; font-weight: 600; padding: 6px 2px; border-radius: 10px;
    }
    .nav-inferior svg { width: 20px; height: 20px; }
    .nav-inferior [aria-current="page"] { color: var(--niebla); }
    .avisos { left: 12px; right: 12px; bottom: 140px; max-width: none; }
    .fab { right: 14px; bottom: 82px; padding: 12px 14px; }
    .fab .fab-texto { display: none; }
    .asistente { inset: 0; width: 100%; height: 100%; border-radius: 0; border: 0; }
    .dos, .opciones { grid-template-columns: 1fr; }
    .barra-fila { grid-template-columns: 96px minmax(0, 1fr) 44px; }
  }
  /* ===================== ORDEN DEL REPARTO ===================== */
  .orden-ruta + .orden-ruta { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--linea-suave); }
  .orden-ruta h3 { font: 600 13px Inter, sans-serif; color: var(--niebla-2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; display: flex; gap: 8px; }
  .orden-lista { list-style: none; margin: 0; padding: 0; }
  .orden-lista li { display: flex; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--linea-suave); min-width: 0; }
  .orden-lista li:last-child { border-bottom: 0; }
  .orden-lista li span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .puesto { flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--tinta-2); border: 1px solid var(--linea); font: 700 13px 'Space Grotesk', sans-serif; color: var(--niebla); }
  /* ===================== ACCESO ===================== */
  .acceso { display: none; }
  body.sin-sesion .acceso { display: grid; place-items: center; position: fixed; inset: 0; z-index: 60; background: var(--noche); padding: 16px; overflow-y: auto; }
  body.sin-sesion .marco, body.sin-sesion .nav-inferior, body.sin-sesion .fab { display: none !important; }
  .acceso-caja { width: 100%; max-width: 380px; background: var(--tinta); border: 1px solid var(--linea); border-radius: 18px; padding: 26px 22px; box-shadow: var(--sombra); }
  .acceso-caja .btn { width: 100%; justify-content: center; }

  /* ===================== ASPECTO CLARO TURISTO ===================== */
  body { background: radial-gradient(1200px 520px at 85% -10%, color-mix(in srgb, var(--lima) 16%, transparent), transparent 70%), radial-gradient(900px 600px at -10% 10%, color-mix(in srgb, var(--violeta) 9%, transparent), transparent 70%), var(--noche); background-attachment: fixed; }
  .entrada, select.entrada, textarea.entrada { background: #fff; border-radius: 12px; }
  .entrada:hover { border-color: color-mix(in srgb, var(--violeta) 35%, var(--linea)); }
  .entrada:focus { border-color: var(--violeta); box-shadow: 0 0 0 3px color-mix(in srgb, var(--violeta) 16%, transparent); }
  .btn { border-radius: 12px; transition: transform var(--t), box-shadow var(--t), background var(--t), border-color var(--t), filter var(--t); }
  .btn:not(.btn-sec):not(.btn-peligro):not(:disabled) { box-shadow: 0 8px 18px -10px rgba(76, 69, 164, .75); }
  .btn:hover:not(:disabled) { transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: translateY(0) scale(.98); }
  .btn-sec { background: #fff; }
  .btn-sec:hover { border-color: var(--violeta); color: var(--violeta); background: var(--lavanda); }
  .btn-lima:not(:disabled) { box-shadow: 0 8px 18px -10px rgba(120, 130, 0, .8) !important; }
  .btn-icono { transition: background var(--t), color var(--t), border-color var(--t), transform var(--t); }
  .chip { background: #fff; transition: background var(--t), color var(--t), border-color var(--t), transform var(--t); }
  .chip:hover { border-color: var(--violeta); color: var(--violeta); }
  .chip[aria-pressed="true"] { box-shadow: 0 6px 14px -8px rgba(76, 69, 164, .8); }
  .chip[aria-pressed="true"]:hover { color: #fff; }
  .segmentado { background: #fff; border-radius: 12px; }
  .segmentado button[aria-pressed="true"] { background: var(--violeta); color: #fff; }

  .cabeza h1 { color: var(--niebla); }
  .bloque { box-shadow: var(--sombra-suave); }
  .cifras { gap: 14px; background: none; border: 0; border-radius: 0; overflow: visible; }
  .cifra { position: relative; border: 1px solid var(--linea-suave); border-radius: 18px; padding: 18px 18px 16px; box-shadow: var(--sombra-suave); overflow: hidden; transition: transform var(--t), box-shadow var(--t); }
  .cifra::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--violeta); }
  .cifra:nth-child(2)::before { background: var(--menta); }
  .cifra:nth-child(3)::before { background: var(--coral); }
  .cifra:nth-child(4)::before { background: var(--lima); }
  .cifra:nth-child(5)::before { background: var(--ambar); }
  .cifra:hover { transform: translateY(-3px); box-shadow: var(--sombra); }
  .cifra .num { font-size: 30px; color: var(--violeta); }

  .pase { background: #fff; border-radius: 16px; box-shadow: 0 1px 2px rgba(76, 69, 164, .05); transition: border-color var(--t), transform var(--t), box-shadow var(--t), background var(--t); }
  .pase:hover { background: #fff; border-color: color-mix(in srgb, var(--violeta) 35%, var(--linea)); transform: translateY(-2px); box-shadow: var(--sombra-suave); }
  .pase .franja { border-radius: 0 4px 4px 0; }
  .ruta-cod { color: var(--violeta); }
  .trayecto { color: color-mix(in srgb, var(--violeta) 45%, #fff); }
  .estado-et { background: color-mix(in srgb, currentColor 9%, #fff); border-color: color-mix(in srgb, currentColor 28%, #fff); }
  .ruta-chip { background: var(--lavanda); color: var(--violeta); }
  .tarjeta { background: #fff; transition: transform var(--t), box-shadow var(--t), border-color var(--t); }
  .tarjeta:hover { transform: translateY(-2px); box-shadow: var(--sombra-suave); border-color: color-mix(in srgb, var(--violeta) 35%, var(--linea)); }
  .columna-tab { background: var(--tinta-2); }
  .vacio { background: color-mix(in srgb, #fff 70%, transparent); border-color: color-mix(in srgb, var(--violeta) 25%, var(--linea)); }

  .turno .reloj { color: var(--violeta); }
  .puesto { background: var(--lavanda); border-color: transparent; color: var(--violeta); }
  .orden-lista li:first-child .puesto { background: var(--lima); color: var(--sobre-lima); }
  .orden-lista li { transition: background var(--t); border-radius: 10px; }
  .orden-lista li:hover { background: var(--tinta-2); }
  .medidor { background: var(--lavanda); }
  .barra-pista i { background: linear-gradient(90deg, var(--violeta), var(--violeta-2)); transition: width 500ms cubic-bezier(.2, .8, .2, 1), filter var(--t); }
  th { background: #FAF9FF; color: var(--niebla-2); }
  tbody tr:hover td { background: #F7F6FE; }
  .nav .contador-nav { box-shadow: 0 0 0 2px #fff; }
  .nav a[aria-current="page"] .contador-nav { background: var(--lima); color: var(--sobre-lima); }

  .cajon { border-left: 0; border-radius: var(--r-l) 0 0 var(--r-l); }
  .cajon-cab { background: linear-gradient(180deg, var(--lavanda), #fff); border-radius: var(--r-l) 0 0 0; }
  .pasos button { background: #fff; transition: background var(--t), color var(--t), border-color var(--t); }
  .pasos button:hover:not(:disabled):not([aria-pressed="true"]) { border-color: var(--violeta); color: var(--violeta); }
  .pestanas button[aria-selected="true"] { color: var(--violeta); border-bottom-color: var(--violeta); }
  .modal .caja { border: 0; animation: aparecer 220ms cubic-bezier(.2, .8, .2, 1) both; }
  .aviso { background: #fff; border-color: var(--linea-suave); }
  .fab { box-shadow: 0 14px 30px -12px rgba(110, 120, 0, .7), 0 0 0 4px rgba(255, 255, 255, .9); transition: transform var(--t), box-shadow var(--t); }
  .fab:hover { transform: translateY(-2px); filter: none; }
  .asistente { border: 0; }
  .asis-cab { background: linear-gradient(105deg, #433C98, var(--violeta)); color: #fff; border-radius: var(--r-l) var(--r-l) 0 0; border-bottom: 0; }
  .asis-cab .muy-tenue { color: rgba(255, 255, 255, .78) !important; }
  .asis-cab .btn-icono { color: #fff; border-color: rgba(255, 255, 255, .3); }
  .msg.bot { background: var(--lavanda); border-color: transparent; }
  .msg .ficha { background: #fff; }
  .nav-inferior { background: color-mix(in srgb, #fff 92%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-top-color: var(--linea-suave); }
  .nav-inferior [aria-current="page"] { color: var(--violeta); background: var(--lavanda); }

  body.sin-sesion .acceso { background: radial-gradient(900px 500px at 80% 0%, color-mix(in srgb, var(--lima) 22%, transparent), transparent 70%), radial-gradient(800px 600px at 0% 100%, color-mix(in srgb, var(--violeta) 14%, transparent), transparent 70%), var(--noche); }
  .acceso-pila { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .acceso-logo { width: 100%; display: flex; justify-content: center; padding: 18px 24px; border-radius: 999px; background: linear-gradient(105deg, #433C98, var(--violeta) 45%, #5B52C2); box-shadow: 0 14px 34px -18px rgba(60, 50, 150, .75); }
  .acceso-logo img { height: 30px; width: auto; display: block; }
  .acceso-logo b { color: #fff; font: 700 22px 'Space Grotesk', sans-serif; }
  .acceso-caja { border: 0; box-shadow: var(--sombra); }

  /* Entrada suave al cambiar de sección */
  .vista.entrando > * { animation: subir 320ms cubic-bezier(.2, .8, .2, 1) both; }
  .vista.entrando > *:nth-child(2) { animation-delay: 40ms; }
  .vista.entrando > *:nth-child(3) { animation-delay: 80ms; }
  .vista.entrando > *:nth-child(n+4) { animation-delay: 120ms; }
  @keyframes subir { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes aparecer { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
  .grupo-pausa + .grupo-pausa { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--linea-suave); }
  .acciones-pausa { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .lista-pausa { list-style: none; margin: 2px 0 0 22px; padding: 0; font-size: 13px; color: var(--niebla-2); }
  /* Con 4 botones de ruta el selector no cabe en teléfonos muy angostos: se desliza de lado. */
  @media (max-width: 400px) { .barra .segmentado { max-width: 100%; overflow-x: auto; scrollbar-width: none; } .barra .segmentado::-webkit-scrollbar { display: none; } .barra .segmentado button { flex-shrink: 0; padding: 5px 10px; } }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
<script>
(function () {
  'use strict';

  // ======================================================
  // UTILIDADES
  // ======================================================
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const MIN = 60000, HORA = 60 * MIN, DIA = 24 * HORA;
  const ZONA = 'America/Caracas';
  const fmtHora = (ts) => new Date(ts).toLocaleTimeString('es-VE', { timeZone: ZONA, hour: '2-digit', minute: '2-digit', hour12: false });
  const fmtDia = (ts) => new Date(ts).toLocaleDateString('es-VE', { timeZone: ZONA, day: 'numeric', month: 'short' });
  const diaClave = (ts) => new Date(ts).toLocaleDateString('en-CA', { timeZone: ZONA });
  const hoyClave = () => diaClave(Date.now());
  const hace = (ts) => {
    const m = Math.max(0, Math.round((Date.now() - ts) / MIN));
    if (m < 1) return 'ahora';
    if (m < 60) return 'hace ' + m + ' min';
    const h = Math.floor(m / 60);
    return h < 24 ? 'hace ' + h + ' h' : 'hace ' + Math.floor(h / 24) + ' d';
  };
  const iniciales = (n) => String(n).trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();
  const uid = () => Math.random().toString(36).slice(2, 9);
  const tamano = (b) => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';

  const CODIGOS = {
    'Bogotá': 'BOG', 'Medellín': 'MDE', 'Cali': 'CLO', 'Barranquilla': 'BAQ', 'Cartagena': 'CTG', 'Bucaramanga': 'BGA',
    'Madrid': 'MAD', 'Barcelona': 'BCN', 'Valencia': 'VLC', 'Caracas': 'CCS', 'Miami': 'MIA', 'Cancún': 'CUN', 'Lima': 'LIM', 'Tenerife': 'TFN'
  };
  // Las ciudades llegan escritas a mano ("Bogotá, Colombia"): se usa la primera parte.
  const codigo = (c) => {
    const base = String(c || '').split(/[,(/-]/)[0].trim();
    if (!base) return '—';
    const conocida = Object.keys(CODIGOS).find(k => k.toLowerCase() === base.toLowerCase());
    return conocida ? CODIGOS[conocida] : base.normalize('NFD').replace(/[̀-ͯ]/g, '').slice(0, 3).toUpperCase();
  };
  const TRAYECTO = '<svg class="trayecto" viewBox="0 0 46 14" aria-hidden="true"><path d="M2 12 Q23 -2 44 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="44" cy="12" r="2" fill="currentColor"/></svg>';
  const rutaHtml = (l) => '<span class="ruta"><span class="ruta-cod">' + esc(codigo(l.origen)) + '</span>' + TRAYECTO +
    '<span class="ruta-cod">' + esc(codigo(l.destino)) + '</span></span>';

  const ESTADOS = [
    // Fase 1: los estados que ya guarda la base. "Cotizado" y "En seguimiento" llegan en la fase 2.
    { id: 'nuevo', nombre: 'Nuevo' }, { id: 'contactado', nombre: 'Contactado' }, { id: 'cerrado', nombre: 'Venta cerrada' }

      s.onerror = () => { if (!listo) { limpiar(); rechazar(new Error('no se pudo contactar la hoja de Google')); } };

  async function decodificarImagen(archivo) {
    if (window.createImageBitmap) { try { return await createImageBitmap(archivo); } catch (e) { /* se prueba con <img> */ } }
    return await new Promise((ok, mal) => {

  async function comprimirImagen(archivo, ladoMax = COMPROBANTE_LADO_MAX, calidad = COMPROBANTE_CALIDAD) {
    let img;
    try { img = await decodificarImagen(archivo); }
    catch (e) {
      if (/heic|heif/i.test(archivo.type || '') || /\.hei[cf]$/i.test(archivo.name || '')) throw new Error('La foto está en formato HEIC del iPhone, que este navegador no abre. Haz una captura de pantalla de esa foto y sube la captura.');
      throw new Error('El archivo no se pudo abrir como imagen. Prueba con una captura de pantalla (PNG o JPG).');
    }
    const ancho = img.width, alto = img.height;
    if (!ancho || !alto) throw new Error('La imagen llegó vacía. Vuelve a hacer la captura.');
    const escala = Math.min(1, ladoMax / Math.max(ancho, alto));

          if (!resp || !Array.isArray(resp.asesoresAM) || !Array.isArray(resp.asesoresPM)) throw new Error('respuesta sin listas');
          const t = turnoActual(r) || (resp.turno === 'PM' ? 'PM' : 'AM');
          const lista = (t === 'PM' ? resp.asesoresPM : resp.asesoresAM).map(x => typeof x === 'string' ? x : (x && x.nombre)).filter(Boolean).map(x => String(x).trim());
          const sinCupo = (Array.isArray(resp.inhabilitadosEnEstaRuta) ? resp.inhabilitadosEnEstaRuta : []).map(x => normNombre(x && typeof x === 'object' ? x.nombre : x)).filter(Boolean);
          ordenHoja[r] = { nombres: lista, turno: t, turnoHoja: resp.turno || null, fecha: resp.fecha || null, sinCupo, cupo: Number(resp.cupoPorPestana) || null };
        } catch (e) { ordenHoja[r] = { error: true }; }
      }));
    } finally { consultandoOrden = false; }
    revisarFaltantes();
    if (seccionActual() === 'inicio' && !$('#modal').classList.contains('abierto')) repintar();
  }

  // ---- Turno del panel vs. lista de reparto de la hoja ----
  // registros_turno (lo que pinta el panel) y la lista de la hoja (con la que se reparte) son dos listas distintas.
  // Si alguien está en la primera y no en la segunda, se ve "en turno" y no le llega ningún lead.
  // Solo se avisa cuando la hoja respondió bien, con la fecha y el turno de hoy, con una lista creíble,
  // y DOS lecturas seguidas dicen lo mismo. Quien completó su cupo no cuenta: la hoja lo sacó a propósito.
  const faltanEnHoja = {};          // ruta -> Set(id) confirmados en dos lecturas
  const candidatosFalta = {};       // ruta -> Set(id) de la lectura anterior
  let segundaLectura = null;
  const piezasNombre = (n) => { const s = normNombre(n); return s ? s.split(' ') : []; };
  function nombresSeParecen(a, b) {
    const pa = piezasNombre(a), pb = piezasNombre(b);
    if (!pa.length || !pb.length || pa[0] !== pb[0]) return false;
    if (pa.length === 1 || pb.length === 1) return true;
    const corto = pa.length <= pb.length ? pa : pb, largo = corto === pa ? pb : pa;
    if (corto.every(p => largo.includes(p))) return true;
    return largo.includes(corto[corto.length - 1]) || corto.includes(largo[largo.length - 1]);
  }
  function registradosEn(ruta) { const t = turnoActual(ruta); return t ? datos.usuarios.filter(u => u.registros.some(r => r.ruta === ruta && r.turno === t)) : []; }
  function estadoEnHoja(ruta, nombre) {
    const o = ordenHoja[ruta], t = turnoActual(ruta);
    const nada = (motivo) => ({ estado: 'desconocido', motivo });
    if (!t) return nada('fuera de horario');
    if (!o || o.error || !o.nombres) return nada('la hoja no respondió');
    if (o.fecha && o.fecha !== hoyClave()) return nada('la hoja va por otra fecha');
    if (o.turnoHoja && o.turnoHoja !== t) return nada('la hoja todavía no abrió el turno ' + t);
    if (!o.nombres.length) return nada('la hoja devolvió la lista vacía');
    const enPanel = registradosEn(ruta).length;
    if (enPanel >= 4 && o.nombres.length < Math.ceil(enPanel / 2)) return nada('lectura incompleta de la hoja');
    const buscado = normNombre(nombre);
    if (!buscado) return nada('sin nombre');
    const exacto = o.nombres.find(n => normNombre(n) === buscado);
    if (exacto) return { estado: 'si', nombreEnHoja: exacto };
    if ((o.sinCupo || []).includes(buscado)) return { estado: 'cupo' };
    const parecidos = o.nombres.filter(n => nombresSeParecen(n, nombre));
    if (parecidos.length > 1) return nada('varios nombres parecidos en la hoja');
    if (parecidos.length === 1) return { estado: 'parecido', nombreEnHoja: parecidos[0] };
    return { estado: 'no' };
  }
  function revisarFaltantes() {
    let hayNuevos = false;
    Object.keys(RUTAS).forEach(r => {
      const ahora = new Set(registradosEn(r).filter(u => estadoEnHoja(r, u.nombre).estado === 'no').map(u => u.id));
      const antes = candidatosFalta[r] || new Set();
      faltanEnHoja[r] = new Set([...ahora].filter(id => antes.has(id)));
      if ([...ahora].some(id => !antes.has(id))) hayNuevos = true;
      candidatosFalta[r] = ahora;
    });
    clearTimeout(segundaLectura);
    if (hayNuevos) segundaLectura = setTimeout(consultarOrdenHoja, 6000);   // segunda opinión antes de avisar
  }
  const faltaEnHoja = (ruta, id) => !!(faltanEnHoja[ruta] && faltanEnHoja[ruta].has(id)) && registradosEn(ruta).some(u => u.id === id);
  let reanotando = false;
  async function reanotarEnHoja(ruta, nombres) {
    if (reanotando || !nombres.length) return;
    reanotando = true; repintar();
    const fallos = [];
    for (const n of nombres) {      // de uno en uno: el Apps Script usa un candado
      try {
        const resp = await llamarAppsScript({ action: 'registrar', nombre: n }, ruta);
        const msg = (resp && resp.message) || '';
        if (resp && resp.success === false && !/ya est[aá]s? registrad/i.test(msg)) fallos.push(n + ': ' + (msg || 'la hoja no lo aceptó'));
      } catch (e) { fallos.push(n + ': ' + mensajeError(e)); }
    }
    reanotando = false;
    if (fallos.length) fallos.forEach(f => avisar('La hoja de ' + RUTAS[ruta] + ' no lo aceptó · ' + f, 'err'));
    else avisar(nombres.length === 1 && nombres[0] === yo().nombre ? 'Listo: volviste a la hoja de reparto de ' + RUTAS[ruta] + '.' : 'Listo: se volvió a anotar en la hoja de ' + RUTAS[ruta] + ' a ' + nombres.join(', ') + '.');
    candidatosFalta[ruta] = new Set(); faltanEnHoja[ruta] = new Set();
    repintar();
    setTimeout(consultarOrdenHoja, 3000);     // la hoja tarda un momento en reflejarlo
  }
  let ordenPendiente = null;
  const consultarOrdenLuego = (ms = 1500) => { clearTimeout(ordenPendiente); ordenPendiente = setTimeout(consultarOrdenHoja, ms); };
  // Lista de una ruta: la de la hoja; si la hoja no respondió, la del panel por hora de registro.
  function listaDelTurno(ruta) {
    const o = ordenHoja[ruta];
    if (o && o.nombres) return { nombres: o.nombres, deHoja: true };
    const t = turnoActual();
    const regs = [];
    datos.usuarios.forEach(u => u.registros.forEach(r => { if (r.ruta === ruta && r.turno === t) regs.push({ nombre: u.nombre, ts: r.creado_en ? Date.parse(r.creado_en) : 0 }); }));
    return { nombres: regs.sort((a, b) => a.ts - b.ts).map(x => x.nombre), deHoja: false };
  }
  const puestoEn = (ruta, nombre) => { const n = normNombre(nombre); const i = listaDelTurno(ruta).nombres.findIndex(x => normNombre(x) === n); return i < 0 ? null : i + 1; };

  // ---- Recarga con espera (para no recargar 10 veces seguidas con el tiempo real) ----
  let recargaPendiente = null, cargando = false;
  function recargar(ms = 600) {

      finally { cargando = false; }
    }, ms);
  }
  const mensajeError = (e) => {
    const m = String((e && (e.message || e.error_description || e.details)) || e || 'error desconocido');
    if (/failed to fetch|network/i.test(m)) return 'sin conexión. Revisa el internet.';
    if (/jwt|token/i.test(m)) return 'la sesión venció. Sal y vuelve a entrar.';
    return m;
  };

  const yo = () => datos.usuarios.find(u => u.id === miId) || { id: miId, nombre: 'Tú', rol, rutas: [], estado: 'activo', registros: [], enTurno: false, turno: null };
  const usuario = (id) => datos.usuarios.find(u => u.id === id) || (() => { const r = datos.reportes.find(x => x.asesorId === id && x.asesorNombre); return { nombre: r ? r.asesorNombre : 'Asesor' }; })();
  const veTodo = () => rol !== 'asesor';
  const esHoy = (ts) => diaClave(ts) === hoyClave();
  const leadPorId = (id) => { const n = Number(id); return datos.leads.find(l => l.id === n) || buscarEnPeriodos(n); };
  const enTurno = (asesorId) => !!usuario(asesorId).enTurno;

  function leadsVisibles(soloHoy) {

  const sinContactar = (l) => l.estado === 'nuevo' && !l.contactadoEn && !l.comprobante && (Date.now() - l.asignado) >= 15 * MIN;

  // ---- Asesores y rutas ----

  const todosLosAsesores = () => datos.usuarios.filter(u => u.rol === 'asesor' || u.rol === 'asignador');
  const asesoresActivos = (ruta) => todosLosAsesores().filter(u => u.estado === 'activo' && u.rutas.length && (!ruta || ruta === 'TODAS' || u.rutas.includes(ruta)));
  const sinRuta = () => todosLosAsesores().filter(u => u.rol === 'asesor' && u.estado === 'activo' && !u.rutas.length);
  const nombreRutas = (rutas) => { const n = rutas.map(r => RUTAS[r]); return !n.length ? 'sin ruta' : n.length === 1 ? n[0] : n.slice(0, -1).join(', ') + ' y ' + n[n.length - 1]; };

  // ---- Límite de leads erróneos (el mismo cálculo que el panel actual) ----

    const limite = datos.ajustes.activo ? datos.ajustes.limiteDiario : 0;

  function secciones() {

  // ======================================================

  const VISTAS = {};

  // ---------------- INICIO ----------------
  VISTAS.inicio = function () {
    const u = yo();
    const hoy = leadsVisibles(true);
