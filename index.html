    const urgentes = hoy.filter(sinContactar).sort((a, b) => a.asignado - b.asignado);
    const vencidos = leadsVisibles().filter(l => l.proxima && l.proxima.ts < ahora && !['cerrado', 'perdido', 'erroneo'].includes(l.estado));
    const proximos = leadsVisibles().filter(l => l.proxima && l.proxima.ts >= ahora && esHoy(l.proxima.ts));
    const porValidar = rol === 'asignador' ? datos.leads.filter(l => l.validacion === 'pendiente') : [];
    const nuevos = hoy.filter(l => l.estado === 'nuevo' && !sinContactar(l));
    const ahoraLista = [...urgentes, ...vencidos, ...porValidar.filter(l => !urgentes.includes(l)), ...nuevos, ...proximos]
      .filter((l, i, arr) => arr.indexOf(l) === i);

    const saludo = new Date().toLocaleTimeString('es-VE', { timeZone: ZONA, hour: '2-digit', hour12: false }) < '12' ? 'Buenos días' : 'Buenas tardes';
    const contactadosHoy = hoy.filter(l => l.contactadoEn || l.comprobante).length;
    const cifras = veTodo()
      ? [[hoy.length, 'leads hoy'], [contactadosHoy, 'contactados'], [urgentes.length, 'sin contactar'], [hoy.filter(l => l.estado === 'cerrado').length, 'ventas'], [datos.reportes.filter(porRevisar).length, 'erróneos por revisar']]
      : (() => { const c = cupoLE(u.id); return [[hoy.length, 'leads hoy'], [contactadosHoy, 'contactados'], [urgentes.length, 'sin contactar'], [hoy.filter(l => l.estado === 'cerrado').length, 'ventas'], [c.usados + ' de ' + c.limite, 'erróneos reportados']]; })();

    return '<div class="cabeza"><div><h1>' + saludo + ', ' + esc(u.nombre.split(' ')[0]) + '</h1>' +
      '<p class="sub">' + (ahoraLista.length ? (veTodo() ? 'Esto es lo que necesita atención en el equipo ahora mismo.' : 'Tienes ' + ahoraLista.length + ' leads esperando algo de ti, ordenados por urgencia.') : 'Nada urgente por ahora.') + '</p></div>' +
      '<div class="acciones">' + (rol === 'asignador' ? '<button type="button" class="btn btn-sec" data-accion="lead-propio">Asignar un lead a mano</button>' : '') + '</div></div>' +
      (rol === 'asesor' && !u.rutas.length ? '<div class="aviso-ruta" role="status"><span class="punto alerta" style="margin-top:7px"></span><div><b>Todavía no tienes ruta asignada</b>' +
        '<p>Tu cuenta ya está creada, pero la asignadora tiene que decidir a qué ruta vas (Venezuela, Argentina o Arg / Vzla) antes de que puedas registrarte en el turno y recibir leads. Avísale que ya entraste.</p></div></div>' : '') +
      (rol === 'asignador' && sinRuta().length ? '<div class="aviso-ruta" role="status"><span class="punto alerta" style="margin-top:7px"></span><div><b>' +
        (sinRuta().length === 1 ? '1 asesor espera ruta' : sinRuta().length + ' asesores esperan ruta') + '</b>' +
        '<p>' + esc(sinRuta().map(x => x.nombre).join(', ')) + ' ya crearon su cuenta. Sin ruta no pueden trabajar.</p>' +
        '<a class="btn btn-chico" style="margin-top:10px" href="#/asesores">Asignar rutas</a></div></div>' : '') +
      ((rol === 'asesor' || (rol === 'asignador' && yo().rutas.length)) ? avisoTurnoHtml() : '') +
      '<div class="cifras">' + cifras.map(c => '<div class="cifra"><span class="num">' + esc(c[0]) + '</span><span>' + esc(c[1]) + '</span></div>').join('') + '</div>' +
      '<div class="rejilla-inicio' + (rol === 'asesor' ? ' es-asesor' : '') + '"><section class="bloque" aria-labelledby="tAhora"><header><h2 id="tAhora">Atiende ahora</h2>' +
      '<div class="acciones"><a class="btn btn-sec btn-chico" href="#/leads">Ver todos</a></div></header>' +
      (ahoraLista.length ? '<div class="lista-pases">' + ahoraLista.slice(0, 8).map(l => paseHtml(l, { conAsesor: veTodo() })).join('') + '</div>'
        : vacioHtml('Todo al día', 'Cuando entre un lead nuevo aparecerá aquí primero.')) +
      '</section><div class="columna">' + (rol === 'asesor' ? turnoHtml() + leHtmlCorto() : (rol === 'asignador' ? pausaHtml() + turnoHtml() : '') + leHtmlCorto() + resumenEquipoHtml()) + '</div></div>';
  };

  let registrandoTurno = false;
  // Llamada a la acción arriba de todo: sin esto, en el celular el botón quedaba debajo de la lista de leads.
  // Rutas abiertas en las que la persona todavía no está registrada en este turno.
  const rutasPorRegistrar = (u, t) => u.rutas.filter(r => turnoActual(r) && !u.registros.some(x => x.ruta === r && x.turno === t));
  // Con una ruta: un botón. Con varias: "Solo …" por ruta y "Todas".
  function botonesRegistro(faltan, chico) {
    const c = chico ? ' btn-chico' : '';
    if (registrandoTurno) return '<button type="button" class="btn btn-lima registrando' + c + '" disabled>Registrando en la hoja…</button>';
    if (faltan.length <= 1) {
      const otra = yo().rutas.length > 1 && faltan.length === 1;
      return '<button type="button" class="btn btn-lima' + c + '" data-accion="turno-registrar" data-valor="' + (faltan[0] || '') + '">' +
        (otra ? (yo().registros.some(x => x.turno === turnoActual()) ? 'Registrarme también en ' : 'Registrarme en ') + esc(RUTAS[faltan[0]]) : 'Registrarme en el turno') + '</button>';
    }
    return '<div class="opciones-registro" role="group" aria-label="Dónde registrarte">' +
      faltan.map(r => '<button type="button" class="btn btn-sec' + c + '" data-accion="turno-registrar" data-valor="' + r + '">Solo ' + esc(RUTAS[r]) + '</button>').join('') +
      '<button type="button" class="btn btn-lima' + c + '" data-accion="turno-registrar" data-valor="">' + (faltan.length === 2 ? 'Las dos' : 'Todas') + '</button></div>';
  }
  function avisoTurnoHtml() {
    const u = yo(), t = turnoActual();
    if (!u.rutas.length || !t) return '';
    const faltan = rutasPorRegistrar(u, t);
    if (!faltan.length) return '';
    const parcial = u.registros.some(x => x.turno === t);      // ya está en alguna ruta de este turno
    return '<section class="turno-cta" aria-labelledby="tCta"><span class="punto ' + (parcial ? 'ok' : 'alerta') + '"></span><div class="texto"><b id="tCta">' +
      (parcial ? '¿También quieres recibir de ' + esc(nombreRutas(faltan)) + '?' : 'No estás recibiendo leads') + '</b>' +
      '<p>' + (parcial ? 'Ya estás recibiendo leads de ' + esc(nombreRutas(u.registros.filter(x => x.turno === t).map(x => x.ruta))) + '. Si quieres, regístrate también aquí. ' : '') + 'El turno ' + t + ' está abierto hasta las ' + (t === 'AM' ? '17:00' : '23:00') + ' (hora de Caracas). ' + (parcial ? '' : faltan.length > 1 ? 'Elige dónde quieres recibir leads: en una ruta o en todas.' : 'Regístrate para entrar en la lista de reparto' + (u.rutas.length > 1 ? ' de ' + esc(RUTAS[faltan[0]]) : '') + '.') + '</p></div>' +
      botonesRegistro(faltan) + '</section>';
  }
  function turnoHtml() {
    const u = yo();
    const dentro = miTurno() && u.rutas.length > 0;
    const t = turnoActual();
    if (!u.rutas.length) {
      if (rol === 'asignador') {
        return '<section class="bloque turno" aria-labelledby="tTurno"><h2 id="tTurno">Tu turno</h2>' +
          '<div class="estado-turno"><span class="punto"></span>No atiendes leads</div>' +
          '<p class="tenue" style="font-size:14px">Si también vas a atender leads, márcate una ruta en Asesores y rutas: después te registras aquí como cualquier asesor.</p>' +
          '<a class="btn btn-sec btn-chico" href="#/asesores" style="align-self:flex-start">Marcarme una ruta</a></section>';
      }
      return '<section class="bloque turno" aria-labelledby="tTurno"><h2 id="tTurno">Tu turno</h2>' +
        '<div class="estado-turno"><span class="punto"></span>Sin ruta asignada</div>' +
        '<p class="tenue" style="font-size:14px">Para registrarte en el turno, la asignadora tiene que decidir a qué ruta vas (Venezuela, Argentina o Arg / Vzla).</p></section>';
    }
    const registradas = t ? u.registros.filter(r => r.turno === t).map(r => r.ruta) : [];
    const puestos = registradas.map(r => { const p = puestoEn(r, u.nombre); return p ? '<div class="linea-dato"><span class="tenue">Tu puesto en ' + esc(RUTAS[r]) + '</span><span class="num"><b>' + p + '</b> de ' + listaDelTurno(r).nombres.length + '</span></div>' : ''; }).join('');
    const fuera = registradas.filter(r => faltaEnHoja(r, u.id));
    const avisosHoja = registradas.map(r => {
      if (fuera.includes(r)) return '<div class="aviso-hoja rojo" role="alert"><b>No estás en la lista de reparto de ' + esc(RUTAS[r]) + '</b><p>El panel te tiene en el turno, pero la hoja de reparto no. Así no te llega ningún lead.</p>' +
        '<button type="button" class="btn btn-chico" data-accion="reanotar" data-valor="' + r + '"' + (reanotando ? ' disabled' : '') + '>' + (reanotando ? 'Anotándote…' : 'Volver a anotarme en la hoja') + '</button></div>';
      const e = estadoEnHoja(r, u.nombre);
      if (e.estado === 'cupo') return '<div class="aviso-hoja"><b>Completaste tu cupo en ' + esc(RUTAS[r]) + '</b><p>La hoja te sacó del reparto de hoy a propósito. Está todo bien.</p></div>';
      if (e.estado === 'parecido') return '<div class="aviso-hoja"><b>Tu nombre está escrito distinto en la hoja</b><p>En la hoja de ' + esc(RUTAS[r]) + ' figuras como “' + esc(e.nombreEnHoja) + '” y aquí como “' + esc(u.nombre) + '”. Sí recibes leads, pero puede que no te salgan en el panel. Avisa para que lo unifiquen.</p></div>';
      return '';
    }).join('');
    const cupos = u.rutas.filter(r => miCupo[r]).map(r => {
      const c = miCupo[r];
      return '<div class="linea-dato"><span class="tenue">' + esc(RUTAS[r]) + '</span><span class="num">' + (c.inhabilitado ? 'Cupo completo' : c.leads + (c.cupo ? ' de ' + c.cupo : '') + ' leads hoy') + '</span></div>' +
        (c.detalle ? '<p class="ayuda" style="margin-top:-4px">' + esc(c.detalle) + '</p>' : '');
    }).join('');
    const boton = !t ? '<button type="button" class="btn btn-sec" disabled>Registro cerrado ahora</button>'
      : registrandoTurno ? '<button type="button" class="btn btn-lima registrando" disabled>Registrando en la hoja…</button>'
      : dentro ? '<button type="button" class="btn btn-sec" data-accion="turno">Salir del turno</button>'
      : botonesRegistro(rutasPorRegistrar(u, t));
    return '<section class="bloque turno" aria-labelledby="tTurno"><h2 id="tTurno">Tu turno' + (t ? ' ' + t : '') + '</h2>' +
      '<div class="reloj num" id="reloj">' + fmtHora(Date.now()) + '</div>' +
      '<div class="estado-turno"><span class="punto ' + (dentro && fuera.length < registradas.length ? 'ok' : dentro ? 'alerta' : '') + '"></span>' + (!dentro ? 'No estás recibiendo leads' : fuera.length >= registradas.length ? 'Fuera de la lista de reparto' : 'Estás en la lista de reparto') + '</div>' +
      '<div class="rutas-turno">' + u.rutas.map(r => '<span class="ruta-chip">' + RUTAS[r] + (registradas.includes(r) ? ' ✓' : '') + '</span>').join('') + '</div>' +
      puestos + avisosHoja + cupos + boton +
      '<p class="ayuda">' + (t ? 'Primero te anota la hoja de reparto de cada ruta; solo entonces te pones en verde aquí.' : textoHorario()) + '</p></section>';
  }
  function resumenEquipoHtml() {
    const t = turnoActual();
    const rutas = rutaFiltro === 'TODAS' ? Object.keys(RUTAS) : [rutaFiltro];
    const bloques = rutas.map(r => {
      const l = listaDelTurno(r);
      return '<div class="orden-ruta"><h3>' + esc(RUTAS[r]) + ' <span class="muy-tenue num">' + l.nombres.length + '</span></h3>' +
        (l.nombres.length ? '<ol class="orden-lista">' + l.nombres.map((n, i) => '<li><span class="puesto num">' + (i + 1) + '</span><span>' + esc(n) + '</span></li>').join('') + '</ol>'
          : '<p class="tenue" style="font-size:14px">Nadie registrado todavía.</p>') +
        (l.nombres.length && !l.deHoja ? '<p class="ayuda">La hoja no respondió: orden por hora de registro en el panel.</p>' : '') +
        (() => {
          const faltan = registradosEn(r).filter(u => faltaEnHoja(r, u.id));
          if (!faltan.length) return '';
          return '<div class="aviso-hoja rojo" role="alert"><b>' + (faltan.length === 1 ? '1 asesor no está' : faltan.length + ' asesores no están') + ' en la hoja de reparto</b>' +
            '<p>' + esc(faltan.map(u => u.nombre).join(', ')) + (faltan.length === 1 ? ' figura' : ' figuran') + ' en el turno del panel pero no en la hoja de ' + esc(RUTAS[r]) + ': no ' + (faltan.length === 1 ? 'le llega' : 'les llega') + ' ningún lead.</p>' +
            (rol === 'asignador' ? '<button type="button" class="btn btn-chico" data-accion="reanotar-todos" data-valor="' + r + '"' + (reanotando ? ' disabled' : '') + '>' + (reanotando ? 'Anotando…' : 'Volver a anotarlos en la hoja') + '</button>' : '') + '</div>';
        })() + '</div>';
    }).join('');
    return '<section class="bloque" aria-labelledby="tEq"><header><h2 id="tEq">' + (t ? 'Orden del reparto · turno ' + t : 'Sin turno abierto') + '</h2><div class="acciones"><a class="btn btn-sec btn-chico" href="#/equipo">Ver turnos</a></div></header>' +
      (t ? bloques : '<p class="tenue">' + textoHorario() + '</p>') + '</section>';
  }
  // Pausa del reparto automático: la guarda cada Apps Script (grupo TODOS de cada ruta).
  function estadoGrupoPausa(g) {
    const filas = g.objetivos.map(o => ({ o, p: pausa[clavePausa(o)] }));
    const leidas = filas.filter(f => f.p && !f.p.error);
    const pausadas = leidas.filter(f => f.p.pausado);
    const modo = !leidas.length ? 'desconocido' : !pausadas.length ? 'activo' : pausadas.length === filas.length ? 'pausado' : 'parcial';
    return { filas, modo };
  }
  function pausaHtml() {
    const btn = (g, accion, texto, apagado) => '<button type="button" class="btn btn-sec btn-chico" data-accion="pausa" data-valor="' + g.id + '" data-modo="' + accion + '"' + (apagado ? ' disabled' : '') + '>' + texto + '</button>';
    return '<section class="bloque" aria-labelledby="tPausa"><header><h2 id="tPausa">Reparto automático</h2></header>' +
      GRUPOS_PAUSA.map(g => {
        const { filas, modo } = estadoGrupoPausa(g);
        const apagado = !!pausaOcupada || modo === 'desconocido';
        const consultando = filas.some(f => !f.p);
        const chip = pausaOcupada === g.id ? 'Guardando…' : { activo: 'Repartiendo', pausado: 'En pausa', parcial: 'Pausa parcial', desconocido: consultando ? 'Consultando…' : 'No se pudo leer' }[modo];
        const punto = modo === 'activo' ? 'ok' : modo === 'desconocido' ? '' : 'alerta';
        const botones = modo === 'parcial' ? btn(g, 'pausar', 'Completar pausa', apagado) + btn(g, 'reanudar', 'Reanudar todo', apagado)
          : modo === 'pausado' ? btn(g, 'reanudar', 'Reanudar', apagado) : btn(g, 'pausar', 'Pausar', apagado);
        const detalle = filas.map(f => {
          const p = f.p; let t;
          if (!p) t = 'consultando…';
          else if (p.error) t = 'no se pudo leer';
          else if (p.pausado) t = p.automatica ? 'pausa automática' + (p.hasta ? ' hasta las ' + p.hasta : '') : 'en pausa';
          else if (f.o.ruta === 'ARGVZLA' && f.o.grupo === 'VZLA' && pausa['ARGVZLA|TODOS'] && pausa['ARGVZLA|TODOS'].pausado) t = 'detenida por “Argentina y Arg / Vzla”';
          else t = 'repartiendo';
          return '<li>' + esc(f.o.etiqueta) + ' · ' + esc(t) + '</li>';
        }).join('');
        return '<div class="grupo-pausa"><div class="linea-dato" style="align-items:center"><span><span class="punto ' + punto + '"></span> <b>' + esc(g.titulo) + '</b> · <span class="tenue">' + chip + '</span></span>' +
          '<span class="acciones-pausa">' + botones + '</span></div><ul class="lista-pausa">' + detalle + '</ul></div>';
      }).join('') +
      '<p class="ayuda">' + (Object.values(pausa).some(p => p && p.automatica) ? 'La pausa automática termina sola; “Reanudar” la salta solo por hoy. ' : '') + 'La pausa manual dura hasta que alguien la reanude.' +
      (GRUPOS_PAUSA.some(g => estadoGrupoPausa(g).modo === 'parcial') ? ' Si un grupo quedó a medias, completa la pausa o reanuda todo.' : '') + '</p></section>';
  }
  function leHtmlCorto() {
    if (veTodo()) {
      const pend = datos.reportes.filter(porRevisar);
      return '<section class="bloque" aria-labelledby="tLE"><header><h2 id="tLE">Leads erróneos</h2></header>' +
        (pend.length ? '<p>' + pend.length + (pend.length === 1 ? ' reporte espera' : ' reportes esperan') + ' tu revisión.</p><a class="btn btn-sec btn-chico" style="margin-top:12px" href="#/erroneos">Revisar reportes</a>'
          : '<p class="tenue">No hay reportes por revisar.</p>') + '</section>';
    }
    const c = cupoLE(yo().id);
    return '<section class="bloque" aria-labelledby="tLE"><header><h2 id="tLE">Leads erróneos</h2></header>' +
      '<div class="cupo-le"><span class="num">' + c.quedan + '</span><span>reportes disponibles hoy de ' + c.limite + '</span></div>' +
      '<p class="ayuda">' + esc(textoReglaLE()) + '</p></section>';
  }

  // ---------------- PERIODOS (historial y estadísticas) ----------------
  // Los últimos 7 días ya vienen cargados. Para más atrás se piden aparte a Supabase y se guardan 10 minutos.
  const OPCIONES_PERIODO = [['hoy', 'Hoy'], ['7', 'Últimos 7 días'], ['30', 'Últimos 30 días'], ['90', 'Últimos 90 días'], ['todo', 'Todo el historial'], ['rango', 'Elegir fechas…']];
  const PRIMER_DIA = '2024-01-01';
  const periodos = {};               // "desde|hasta" -> { ts, leads } | { cargando } | { error }
  function rangoDe(f) {
    const hoy = hoyClave();
    if (f.sel === 'hoy') return { desde: hoy, hasta: hoy };
    if (f.sel === 'todo') return { desde: PRIMER_DIA, hasta: hoy };
    if (f.sel === 'rango') { let d = f.desde || hoy, x = f.hasta || hoy; if (d > x) [d, x] = [x, d]; return { desde: d, hasta: x }; }
    return { desde: fechaConDesfase(-((Number(f.sel) || 7) - 1)), hasta: hoy };
  }
  const fechaDe = (l) => l.fecha || diaClave(l.asignado);
  function buscarEnPeriodos(id) {
    for (const k in periodos) { const p = periodos[k]; const l = p.leads && p.leads.find(x => x.id === id); if (l) return l; }
    return null;
  }
  // { leads } listo · { cargando } mientras llega · { error }
  function leadsDelRango(r) {
    if (r.desde >= fechaConDesfase(-(DIAS_CARGADOS - 1))) return { leads: datos.leads.filter(l => { const f = fechaDe(l); return f >= r.desde && f <= r.hasta; }) };
    const k = r.desde + '|' + r.hasta, p = periodos[k];
    if (p && p.leads) { if (!p.cargando && Date.now() - p.ts > 10 * MIN) cargarRango(r, k); return { leads: p.leads }; }
    if (p && p.error) return { error: p.error };
    if (!p) cargarRango(r, k);
    return { cargando: true };
  }
  async function cargarRango(r, k) {
    const previo = periodos[k];
    periodos[k] = Object.assign({}, previo, { cargando: true });
    const yoId = miId, todo = veTodo();
    try {
      let filas = null, ultimo = null;
      for (const col of COLUMNAS_LEADS) {
        try {
          filas = await traerTodasLasFilas(() => {
            let q = sb.from('leads').select(col).gte('fecha', r.desde).lte('fecha', r.hasta).in('ruta', Object.keys(RUTAS)).order('id', { ascending: false });
            if (!todo) q = q.eq('asesor_id', yoId);
            return q;
          }, 40000);
          break;
        } catch (e) { ultimo = e; }
      }
      if (!filas) throw ultimo;
      if (miId !== yoId) return;      // cerró sesión mientras cargaba
      periodos[k] = { ts: Date.now(), leads: filas.map(leadDesdeFila) };
    } catch (e) {
      if (miId !== yoId) return;
      periodos[k] = previo && previo.leads ? previo : { error: mensajeError(e) };
      avisar('No se pudo cargar el periodo: ' + mensajeError(e), 'err');
    }
    repintar();
  }
  function periodoHtml(f, cual) {
    const r = rangoDe(f), hoy = hoyClave();
    return '<label class="sr" for="periodo-' + cual + '">Periodo</label><select class="entrada" id="periodo-' + cual + '" data-cambio="periodo" data-cual="' + cual + '">' +
      OPCIONES_PERIODO.map(o => '<option value="' + o[0] + '"' + (f.sel === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select>' +
      (f.sel === 'rango' ? '<form class="rango-fechas" data-cual="' + cual + '" novalidate>' +
        '<label class="sr" for="desde-' + cual + '">Desde</label><input class="entrada" type="date" id="desde-' + cual + '" name="desde" value="' + esc(r.desde) + '" min="' + PRIMER_DIA + '" max="' + hoy + '">' +
        '<span class="tenue" aria-hidden="true">a</span>' +
        '<label class="sr" for="hasta-' + cual + '">Hasta</label><input class="entrada" type="date" id="hasta-' + cual + '" name="hasta" value="' + esc(r.hasta) + '" min="' + PRIMER_DIA + '" max="' + hoy + '">' +
        '<button type="submit" class="btn btn-sec btn-chico">Ver</button></form>' : '');
  }
  const textoPeriodo = (f) => { const r = rangoDe(f); return f.sel === 'rango' ? (r.desde === r.hasta ? fmtDia(Date.parse(r.desde + 'T16:00:00Z')) : fmtDia(Date.parse(r.desde + 'T16:00:00Z')) + ' – ' + fmtDia(Date.parse(r.hasta + 'T16:00:00Z'))) : (OPCIONES_PERIODO.find(o => o[0] === f.sel) || [0, ''])[1]; };

  // ---------------- LEADS ----------------
  const filtrosLeads = { estado: 'activos', texto: '', asesor: '', vista: 'lista', periodo: { sel: '7', desde: '', hasta: '' }, mostrar: 60 };
  VISTAS.leads = function () {
    const carga = leadsDelRango(rangoDe(filtrosLeads.periodo));
    let lista = (carga.leads || []).filter(l => (veTodo() || l.asesorId === yo().id) && (rutaFiltro === 'TODAS' || l.ruta === rutaFiltro));

  // La IA revisa la captura de un reporte ya enviado y DECIDE: la función del servidor lo aprueba o lo anula
  // con la sesión de quien lo pidió. Quien revisa puede anular después un reporte que la IA aprobó.
  const revisandoIA = new Set();
  let revisionMasiva = null;
  async function revisarReporteConIA(r, silencioso) {
    const id = String(r.id);
    if (revisandoIA.has(id)) return null;
    revisandoIA.add(id); if (!silencioso) repintar();
    try {
      const { data, error } = await sb.functions.invoke(FUNCION_IA_ERRONEOS, { body: { reporte_id: Number(r.id) } });
      let msg = null;
      if (error) { msg = error.message; try { const c = await error.context.json(); if (c && c.error) msg = c.error; } catch (e2) {} }
      else if (!data || !data.ok) msg = (data && data.error) || 'La IA no respondió.';
      if (msg) { if (!silencioso) avisar('La IA no pudo revisarlo: ' + msg, 'err'); return { error: msg }; }
      if (data.veredicto !== 'error') r.ia = { veredicto: data.veredicto, explicacion: data.explicacion || '' };
      if (!silencioso) {
        if (data.error_decision) avisar('La IA decidió ' + (data.veredicto === 'confirma' ? 'aprobarlo' : 'anularlo') + ', pero no se pudo aplicar: ' + data.error_decision, 'err');
        else if (data.decision === 'aprobado') avisar('La IA aprobó el reporte.');
        else if (data.decision === 'anulado') avisar('La IA anuló el reporte: ' + (data.explicacion || ''));
        else if (data.veredicto === 'error') avisar('La IA no pudo revisar la captura. Decide tú con Aprobar o Anular.', 'err');
        else if (!data.decision) avisar(data.veredicto === 'confirma' ? 'La IA lo da por válido. Despliega la función v1.4 para que lo aplique sola.' : 'La IA no lo da por válido. Despliega la función v1.4 para que lo aplique sola.');
        else avisar('La IA ' + (data.veredicto === 'confirma' ? 'lo da por válido' : 'no lo da por válido') + ', pero el reparto no lo había aplicado: no hay nada que cambiar.');
      }
      if (data.decision === 'aprobado' || data.decision === 'anulado') recargar(100);
      return data;
    } catch (e) {
      if (!silencioso) avisar('La IA no pudo revisarlo: ' + mensajeError(e), 'err');
      return { error: mensajeError(e) };
    } finally { revisandoIA.delete(id); repintar(); }
  }
  async function revisarTodosConIA(lista) {
    revisionMasiva = { hechos: 0, total: lista.length };
    const cuenta = { aprobado: 0, anulado: 0, otros: 0, fallos: 0 };
    let i = 0;
    const trabajador = async () => {
      while (i < lista.length) {
        const r = lista[i++];
        const res = await revisarReporteConIA(r, true);
        if (!res || res.error || res.error_decision || res.veredicto === 'error') cuenta.fallos++; else if (res.decision in cuenta) cuenta[res.decision]++; else cuenta.otros++;
        revisionMasiva.hechos++; repintar();
        if (res && res.error && /m[aá]ximo|sesi[oó]n|solo asignaci/i.test(res.error)) { i = lista.length; avisar(res.error, 'err'); }
      }
    };
    await Promise.all([trabajador(), trabajador()]);   // de dos en dos para no saturar
    revisionMasiva = null;
    avisar('La IA terminó: ' + cuenta.aprobado + ' aprobados y ' + cuenta.anulado + ' anulados' + (cuenta.otros ? ', ' + cuenta.otros + ' sin cambios' : '') + (cuenta.fallos ? ', ' + cuenta.fallos + ' que no pudo decidir (decide tú)' : '') + '.');
    recargar(200);
  }

    return '<div class="bloque" style="padding:14px 16px;background:var(--tinta-2);margin-bottom:8px">' +

      (r.nota ? '<p style="font-size:13.5px;margin-top:6px">' + (/^(Aprobado|Anulado) por la IA/.test(r.nota) ? '' : 'Nota de supervisión: ') + esc(r.nota) + '</p>' : '') + lineaIA + avisoRevision + '</div>' +
      '<span class="estado-et" data-e="' + est[1] + '">' + esc(est[0]) + '</span></div>' +
      (veTodo() ? '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">' +


        (puedeRevisar && r.evidencia ? '<button type="button" class="btn btn-lima btn-chico" data-accion="revisar-ia" data-id="' + r.id + '"' + (revisandoIA.has(String(r.id)) ? ' disabled' : '') + '>' + (revisandoIA.has(String(r.id)) ? 'La IA está decidiendo…' : 'Que la IA decida') + '</button>' : '') +

        (aprobadoPorIA ? '<button type="button" class="btn btn-peligro btn-chico" data-accion="anular-le" data-id="' + r.id + '">Anular de todas formas</button>' : '') +
        (r.evidencia ? '<button type="button" class="btn btn-sec btn-chico" data-accion="ver-captura" data-id="' + r.id + '">Ver captura</button>' : '') +
        (l.id ? '<button type="button" class="btn btn-sec btn-chico" data-accion="abrir-lead" data-id="' + l.id + '">Ver el lead</button>' : '') + '</div>' : '') + '</div>';
  }

  // ---------------- ASESORES Y RUTAS (asignador) ----------------
  const filtrosAsesores = { grupo: 'todos', texto: '' };
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  const gruposPorRuta = () => Object.fromEntries(Object.keys(RUTAS).map(r => [r, u => u.estado !== 'retirado' && u.rutas.includes(r)]));
  VISTAS.asesores = function () {
    const todos = todosLosAsesores();
    const pendientes = sinRuta();
    const grupos = {
      todos: u => u.estado !== 'retirado',
      ...gruposPorRuta(),
      asignador: u => u.estado !== 'retirado' && u.rol === 'asignador',
      bloqueado: u => u.estado === 'bloqueado',
      retirado: u => u.estado === 'retirado'
    };
    const etiquetas = Object.assign({ todos: 'Todos' }, RUTAS, { asignador: 'Asignadores', bloqueado: 'Bloqueados', retirado: 'Retirados' });

    const bloquePendientes = pendientes.length
      ? '<section class="bloque pendientes" aria-labelledby="tPend" style="margin-bottom:22px"><header><h2 id="tPend">Esperan ruta</h2><span class="contador-et num">' + pendientes.length + '</span></header>' +
        '<p class="bloque-desc">Crearon su cuenta y todavía no pueden trabajar: sin ruta no pueden registrarse en el turno ni reciben leads.</p>' +
        pendientes.map(u => '<div class="fila-pendiente"><span class="persona"><span class="avatar">' + esc(iniciales(u.nombre)) + '</span><span><b>' + esc(u.nombre) + '</b>' +
          '<small>' + (u.creado ? 'Creó su cuenta ' + hace(u.creado) : 'Se quedó sin ruta') + '</small></span></span>' +
          '<span class="acciones-asesor"><span class="tenue" style="font-size:13px;align-self:center">Enviar a</span>' +
          Object.keys(RUTAS).map(r => '<button type="button" class="btn btn-sec btn-chico" data-accion="ruta-pendiente" data-id="' + u.id + '" data-valor="' + r + '">' + esc(RUTAS[r]) + '</button>').join('') +
          '<button type="button" class="btn btn-chico" data-accion="ruta-pendiente" data-id="' + u.id + '" data-valor="AMBAS">Todas</button></span></div>').join('') +
        '</section>'
      : '';

    return '<div class="cabeza"><div><h1>Asesores y rutas</h1><p class="sub">Elige a qué ruta va cada persona. Solo recibe leads, ve el turno y se registra en las rutas que tenga marcadas. Los asignadores también salen aquí: si atienden leads, márcales su ruta.</p></div></div>' +
      bloquePendientes +
      '<div class="herramientas"><div class="chips" role="group" aria-label="Filtrar asesores">' +
      Object.keys(etiquetas).map(k => '<button type="button" class="chip" data-accion="filtro-asesores" data-valor="' + k + '" aria-pressed="' + (filtrosAsesores.grupo === k) + '">' + etiquetas[k] +
        ' <span class="cuenta num">' + todos.filter(grupos[k]).length + '</span></button>').join('') + '</div>' +
      '<div class="buscador" style="margin-left:auto;flex:0 1 260px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>' +
      '<label class="sr" for="buscarAsesor">Buscar asesor</label><input class="entrada" id="buscarAsesor" type="search" placeholder="Buscar asesor" value="' + esc(filtrosAsesores.texto) + '" autocomplete="off"></div></div>' +
      '<section class="bloque" aria-label="Lista de asesores"><div class="cab-asesores" aria-hidden="true"><span>Asesor</span><span>Rutas</span><span>Turno</span><span>Leads hoy</span><span></span></div>' +
      '<div id="listaAsesores">' + listaAsesoresHtml(grupos) + '</div></section>';
  };

  function listaAsesoresHtml(grupos) {
    grupos = grupos || Object.assign({ todos: u => u.estado !== 'retirado' }, gruposPorRuta(), { asignador: u => u.estado !== 'retirado' && u.rol === 'asignador', bloqueado: u => u.estado === 'bloqueado', retirado: u => u.estado === 'retirado' });
    const t = sinAcentos(filtrosAsesores.texto.trim());
    const lista = todosLosAsesores().filter(grupos[filtrosAsesores.grupo]).filter(u => !t || sinAcentos(u.nombre).includes(t))
      .sort((a, b) => (a.estado === 'activo' ? 0 : 1) - (b.estado === 'activo' ? 0 : 1) || a.nombre.localeCompare(b.nombre));
    if (!lista.length) return vacioHtml('Nadie con este filtro', 'Prueba con otro filtro o borra la búsqueda.');
    return lista.map(u => {
      const hoy = datos.leads.filter(l => l.asesorId === u.id && esHoy(l.asignado)).length;
      const activo = u.estado === 'activo';
      const estadoEt = (u.rol === 'asignador' ? '<span class="etiqueta-estado rol">Asignador' + (u.id === miId ? ' · tú' : '') + '</span>' : '') +
        (u.estado === 'bloqueado' ? '<span class="etiqueta-estado bloq">Bloqueado</span>' : u.estado === 'retirado' ? '<span class="etiqueta-estado ret">Retirado</span>' : '');
      const sub = !activo ? (u.estado === 'bloqueado' ? 'No puede entrar al panel' : 'Ya no trabaja en el equipo')
        : !u.rutas.length ? 'Sin ruta asignada' : enTurno(u.id) ? 'En turno ' + u.turno + ' ahora' : 'Fuera del turno';
      return '<div class="fila-asesor' + (activo ? '' : ' inactivo') + '">' +
        '<span class="persona"><span class="avatar">' + esc(iniciales(u.nombre)) + '</span><span style="min-width:0"><b>' + esc(u.nombre) + estadoEt + '</b>' +
          '<small><span class="punto ' + (activo && enTurno(u.id) ? 'ok' : '') + '"></span>' + sub + '</small></span></span>' +
        '<span class="rutas-sel" role="group" aria-label="Rutas de ' + esc(u.nombre) + '">' + Object.keys(RUTAS).map(r =>
          '<button type="button" class="ruta-btn" data-accion="ruta-toggle" data-id="' + u.id + '" data-valor="' + r + '" aria-pressed="' + u.rutas.includes(r) + '"' + (u.estado === 'retirado' ? ' disabled' : '') + '>' +
          '<span class="caja">' + CHECK + '</span>' + RUTAS[r] + '</button>').join('') + '</span>' +
        '<span class="celda celda-turno"><span class="etq-m">Turno hoy</span>' + (u.turno ? esc(u.turno) : '<span class="muy-tenue">—</span>') + '</span>' +
        '<span class="celda celda-hoy num"><span class="etq-m">Leads hoy</span>' + hoy + '</span>' +
        '<span class="acciones-asesor">' + (u.id === miId ? '' : u.estado === 'retirado'
          ? '<button type="button" class="btn btn-sec btn-chico" data-accion="reincorporar" data-id="' + u.id + '">Reincorporar</button>'
          : '<button type="button" class="btn btn-sec btn-chico" data-accion="rol-asignador" data-id="' + u.id + '">' + (u.rol === 'asignador' ? 'Quitar asignador' : 'Hacer asignador') + '</button>' +
            '<button type="button" class="btn btn-sec btn-chico" data-accion="bloquear" data-id="' + u.id + '">' + (u.estado === 'bloqueado' ? 'Desbloquear' : 'Bloquear') + '</button>' +
            '<button type="button" class="btn btn-peligro btn-chico" data-accion="retirar" data-id="' + u.id + '">Retirar</button>') + '</span></div>';
    }).join('');
  }

  // ---------------- EQUIPO ----------------
  const filtrosEquipo = { turno: turnoActual() || 'AM' };
  VISTAS.equipo = function () {
    // Quién se registró hoy en ese turno (sale de registros_turno, el espejo de la hoja).
    const asesores = todosLosAsesores().filter(u => u.registros.some(r => r.turno === filtrosEquipo.turno && (rutaFiltro === 'TODAS' || r.ruta === rutaFiltro)));
    return '<div class="cabeza"><div><h1>Turnos y cupos</h1><p class="sub">Quién se registró hoy en cada turno, cuántos leads lleva y quién tiene leads sin contactar.</p></div>' +
      (rol === 'asignador' ? '<div class="acciones"><button type="button" class="btn" data-accion="anotar-turno"' + (turnoActual() ? '' : ' disabled title="Ahora no hay turno abierto"') + '>Anotar en el turno</button><a class="btn btn-sec" href="#/asesores">Cambiar rutas</a></div>' : '') + '</div>' +
      '<div class="herramientas"><div class="segmentado" role="group" aria-label="Turno">' +
      ['AM', 'PM'].map(t => '<button type="button" data-accion="turno-equipo" data-valor="' + t + '" aria-pressed="' + (filtrosEquipo.turno === t) + '">Turno ' + t + (t === 'AM' ? ' · hasta 17' : ' · 18 a 23') + '</button>').join('') + '</div></div>' +
      (asesores.length ? '<div class="tabla-marco"><table><caption class="sr">Asesores del turno ' + filtrosEquipo.turno + '</caption><thead><tr><th>Asesor</th><th>Ruta</th><th>Estado</th><th>Leads hoy</th><th class="num">Sin contactar</th><th class="num">Erróneos</th>' + (rol === 'asignador' ? '<th><span class="sr">Acciones</span></th>' : '') + '</tr></thead><tbody>' +
        asesores.map(a => {
          const hoy = datos.leads.filter(l => l.asesorId === a.id && esHoy(l.asignado));
          const n = hoy.length;
          const sc = hoy.filter(sinContactar).length;
          const c = cupoLE(a.id);
          const enEste = a.registros.some(r => r.turno === filtrosEquipo.turno && r.turno === turnoActual());
          const estado = a.estado === 'bloqueado' ? ['Bloqueado', 'erroneo'] : enEste ? ['En turno', 'cerrado'] : ['Turno terminado', 'perdido'];
          const rutasReg = a.registros.filter(r => r.turno === filtrosEquipo.turno).map(r => RUTAS[r.ruta]).filter(Boolean);
          return '<tr><td><span style="display:flex;align-items:center;gap:10px"><span class="avatar" style="width:30px;height:30px;font-size:11px">' + esc(iniciales(a.nombre)) + '</span>' + esc(a.nombre) + '</span></td>' +
            '<td>' + esc(rutasReg.join(' y ')) + '</td><td><span class="estado-et" data-e="' + estado[1] + '">' + estado[0] + '</span></td>' +
            '<td class="num">' + n + '</td>' +
            '<td class="num"' + (sc ? ' style="color:var(--coral);font-weight:700"' : '') + '>' + sc + '</td><td class="num">' + c.usados + ' de ' + c.limite + '</td>' +
            (rol === 'asignador' ? '<td>' + (enEste ? '<button type="button" class="btn btn-sec btn-chico" data-accion="sacar-turno" data-id="' + a.id + '">Sacar del turno</button>' : '') + '</td>' : '') + '</tr>';
        }).join('') + '</tbody></table></div>'
        : vacioHtml('Nadie registrado en el turno ' + filtrosEquipo.turno + ' hoy', 'Los asesores se registran desde su Inicio.')) +
      equidadHtml(filtrosEquipo.turno);
  };

  // ---------------- EQUIDAD DEL REPARTO ----------------
  // Repite el reparto de hoy lead por lead (en orden de asignación) y, en cada uno, mira si había alguien
  // registrado en ese turno y ruta que llevaba MENOS leads que quien lo recibió. Eso es un "salto".
  // Se cuenta por ruta, como lo cuenta cada hoja. (En Colombia los leads de China van aparte; en VE/AR no hay ese grupo.)
  const esLeadChina = () => false;
  const turnoDeHora = (ts) => { const p = new Intl.DateTimeFormat('en-GB', { timeZone: ZONA, hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date(ts));
    const m = (Number((p.find(x => x.type === 'hour') || {}).value) % 24) * 60 + Number((p.find(x => x.type === 'minute') || {}).value); return m < 17 * 60 + 30 ? 'AM' : 'PM'; };
  function auditarEquidad(ruta, turno) {
    const o = ordenHoja[ruta] || {};
    const cupo = o.cupo || 10;
    const sinCupo = o.sinCupo || [];
    const registrados = datos.usuarios.map(u => {
      const reg = u.registros.find(x => x.ruta === ruta && x.turno === turno);
      return reg ? { u, desde: reg.creado_en ? Date.parse(reg.creado_en) : 0 } : null;
    }).filter(Boolean);
    const leads = datos.leads.filter(l => l.ruta === ruta && esHoy(l.asignado) && l.asesorId).sort((a, b) => a.asignado - b.asignado);
    const cuenta = {}, saltos = {}, ultimoSalto = {}, enTurno = {};
    let china = 0;
    for (const l of leads) {
      const delTurno = turnoDeHora(l.asignado) === turno;
      if (delTurno && esLeadChina(l)) { china++; }
      else if (delTurno) {
        const recibe = cuenta[l.asesorId] || 0;
        registrados.forEach(r => {
          if (r.u.id === l.asesorId || r.desde > l.asignado) return;
          if (sinCupo.includes(normNombre(r.u.nombre))) return;
          const lleva = cuenta[r.u.id] || 0;
          if (lleva < recibe && lleva < cupo) { saltos[r.u.id] = (saltos[r.u.id] || 0) + 1; ultimoSalto[r.u.id] = l.asignado; }
        });
      }
      cuenta[l.asesorId] = (cuenta[l.asesorId] || 0) + 1;
      if (delTurno) enTurno[l.asesorId] = (enTurno[l.asesorId] || 0) + 1;
    }
    const filas = registrados.map(r => ({ u: r.u, desde: r.desde, hoy: cuenta[r.u.id] || 0, turno: enTurno[r.u.id] || 0, saltos: saltos[r.u.id] || 0, ultimo: ultimoSalto[r.u.id] || null,
      lleno: sinCupo.includes(normNombre(r.u.nombre)) }))
      .sort((a, b) => a.hoy - b.hoy || a.desde - b.desde);
    // Diferencia entre quien más y quien menos lleva hoy (sin contar a quien ya completó su cupo)
    const activos = filas.filter(f => !f.lleno);
    const dif = activos.length ? Math.max(...activos.map(f => f.hoy)) - Math.min(...activos.map(f => f.hoy)) : 0;
    // Recibieron leads sin estar registrados en este turno (asignación a mano, China u otra hoja)
    const fuera = Object.keys(enTurno).filter(id => !registrados.some(r => r.u.id === id)).map(id => ({ u: usuario(id), n: enTurno[id] }));
    return { filas, dif, fuera, china, totalSaltos: Object.values(saltos).reduce((s, x) => s + x, 0) };
  }
  function equidadHtml(turno) {
    if (!veTodo()) return '';
    const rutas = rutaFiltro === 'TODAS' ? Object.keys(RUTAS) : [rutaFiltro];
    const bloques = rutas.map(r => {
      const a = auditarEquidad(r, turno);
      if (!a.filas.length) return '';
      const nivel = a.totalSaltos === 0 && a.dif <= 1 ? ['ok', 'Parejo'] : a.dif <= 2 && a.totalSaltos <= 2 ? ['duda', 'Revisar'] : ['mal', 'Desparejo'];
      return '<section class="bloque equidad" aria-labelledby="eq-' + r + '" style="margin-top:18px"><header><h2 id="eq-' + r + '">Equidad del reparto · ' + esc(RUTAS[r]) + ' · turno ' + turno + '</h2>' +
        '<span class="sello-eq ' + nivel[0] + '">' + nivel[1] + '</span></header>' +
        '<p class="bloque-desc">Diferencia de leads hoy entre quien más y quien menos lleva: <b class="num">' + a.dif + '</b>. ' +
        (a.totalSaltos ? '<b>' + a.totalSaltos + (a.totalSaltos === 1 ? ' salto' : ' saltos') + '</b>: un lead se le dio a alguien que ya llevaba más que otro registrado.' : 'Ningún salto: cada lead fue a quien menos llevaba.') + '</p>' +
        '<div class="tabla-marco"><table><caption class="sr">Equidad del reparto de ' + esc(RUTAS[r]) + '</caption><thead><tr><th>Asesor</th><th>Registrado</th><th class="num">Leads del turno</th><th class="num">Leads hoy</th><th class="num">Saltado</th></tr></thead><tbody>' +
        a.filas.map(f => '<tr><td>' + esc(f.u.nombre) + (f.lleno ? ' <span class="etiqueta-estado ret">Cupo completo</span>' : '') + '</td>' +
          '<td>' + (f.desde ? fmtHora(f.desde) : '—') + '</td><td class="num">' + f.turno + '</td><td class="num">' + f.hoy + '</td>' +
          '<td class="num"' + (f.saltos ? ' style="color:var(--coral);font-weight:700"' : '') + '>' + (f.saltos ? f.saltos + (f.ultimo ? ' <span class="muy-tenue" style="font-weight:400">(último ' + fmtHora(f.ultimo) + ')</span>' : '') : '0') + '</td></tr>').join('') +
        '</tbody></table></div>' +
        (a.fuera.length ? '<p class="ayuda" style="margin-top:10px">Recibieron leads sin estar registrados en este turno: ' + esc(a.fuera.map(x => x.u.nombre + ' (' + x.n + ')').join(', ')) + '. Suele ser una asignación a mano.</p>' : '') +
        (a.china ? '<p class="ayuda" style="margin-top:6px">' + a.china + (a.china === 1 ? ' lead de China fue' : ' leads de China fueron') + ' a su grupo y no se cuentan como salto.</p>' : '') +
        '<p class="ayuda" style="margin-top:6px">Se calcula con los leads del panel. Un salto puede ser normal si esa persona completó su cupo en la hoja o se registró tarde.</p></section>';
    }).join('');
    return bloques;
  }

  // ---------------- ESTADÍSTICAS ----------------
  // Hoy y 7 días salen de los leads ya cargados; lo demás se pide aparte (ver PERIODOS).
  const filtrosStats = { sel: '7', desde: '', hasta: '' };
  VISTAS.estadisticas = function () {
    const carga = leadsDelRango(rangoDe(filtrosStats));
    const herramientas = '<div class="herramientas">' + periodoHtml(filtrosStats, 'stats') + '</div>';
    if (!carga.leads) {
      return '<div class="cabeza"><div><h1>Estadísticas</h1></div></div>' + herramientas +
        (carga.error ? vacioHtml('No se pudo cargar el periodo', carga.error) : '<div class="vacio cargando" role="status"><b>Cargando ' + esc(textoPeriodo(filtrosStats).toLowerCase()) + '…</b>Si son varios miles de leads tarda unos segundos.</div>');
    }
    const delPeriodo = carga.leads.filter(l => rutaFiltro === 'TODAS' || l.ruta === rutaFiltro);
    // Cuenta a quien tuvo leads en el periodo aunque hoy ya no tenga esa ruta.
    const ids = [...new Set(delPeriodo.map(l => l.asesorId))];
    const filas = ids.map(id => {
      const ls = delPeriodo.filter(l => l.asesorId === id);
      const validos = ls.filter(l => l.estado !== 'erroneo');
      const contactados = validos.filter(l => l.contactadoEn);
      const tiempos = contactados.map(l => (l.contactadoEn - l.asignado) / MIN).filter(x => x >= 0);
      return {
        a: usuario(id), recibidos: validos.length, contactados: contactados.length,
        pct: validos.length ? Math.round(contactados.length / validos.length * 100) : 0,
        tiempo: tiempos.length ? Math.round(tiempos.reduce((s, x) => s + x, 0) / tiempos.length) : null,
        tarde: tiempos.filter(x => x >= 15).length, ventas: validos.filter(l => l.estado === 'cerrado').length,
        erroneos: ls.length - validos.length
      };
    }).sort((x, y) => y.pct - x.pct || y.recibidos - x.recibidos);
    const tot = filas.reduce((s, f) => ({ r: s.r + f.recibidos, c: s.c + f.contactados, v: s.v + f.ventas, e: s.e + f.erroneos }), { r: 0, c: 0, v: 0, e: 0 });

    return '<div class="cabeza"><div><h1>Estadísticas</h1><p class="sub">Rendimiento por asesor. Los leads erróneos no cuentan como recibidos ni como incumplimiento. “Contactado” es tener la hora del primer contacto (al subir el comprobante).</p></div></div>' +
      herramientas +
      '<div class="cifras"><div class="cifra"><span class="num">' + tot.r + '</span><span>leads recibidos</span></div><div class="cifra"><span class="num">' + (tot.r ? Math.round(tot.c / tot.r * 100) : 0) + ' %</span><span>contactados</span></div>' +
      '<div class="cifra"><span class="num">' + tot.v + '</span><span>ventas cerradas</span></div><div class="cifra"><span class="num">' + tot.e + '</span><span>erróneos</span></div></div>' +
      (filas.length ? '<section class="bloque" style="margin-bottom:20px" aria-labelledby="tGraf"><header><h2 id="tGraf">Leads contactados por asesor</h2><span class="muy-tenue" style="font-size:13px">La línea marca el 80 %</span></header>' +
      '<div class="barras">' + filas.map(f => '<div class="barra-fila"><span class="nombre">' + esc(f.a.nombre) + '</span>' +
        '<span class="barra-pista" tabindex="0" aria-label="' + esc(f.a.nombre) + ': ' + f.pct + ' por ciento, ' + f.contactados + ' de ' + f.recibidos + '" style="--x:' + Math.max(12, f.pct) + '%">' +
        '<i style="width:' + f.pct + '%"></i><span class="umbral" style="left:80%"></span><span class="tip">' + f.contactados + ' de ' + f.recibidos + ' contactados</span></span>' +
        '<span class="valor num">' + f.pct + ' %</span></div>').join('') + '</div></section>' +
      '<div class="tabla-marco"><table><caption class="sr">Detalle por asesor</caption><thead><tr><th>Asesor</th><th class="num">Recibidos</th><th class="num">Contactados</th><th class="num">Tiempo al primer contacto</th><th class="num">Contactados tarde</th><th class="num">Ventas</th><th class="num">Erróneos</th></tr></thead><tbody>' +
      filas.map(f => '<tr><td>' + esc(f.a.nombre) + '</td><td class="num">' + f.recibidos + '</td><td class="num">' + f.contactados + ' (' + f.pct + ' %)</td><td class="num">' + (f.tiempo == null ? '—' : f.tiempo + ' min') + '</td>' +
        '<td class="num"' + (f.tarde ? ' style="color:var(--coral)"' : '') + '>' + f.tarde + '</td><td class="num">' + f.ventas + '</td><td class="num">' + f.erroneos + '</td></tr>').join('') +
      '</tbody></table></div>' : vacioHtml('Sin leads en este periodo', 'Prueba con otro periodo o con otra ruta.'));
  };

  // ---------------- AJUSTES ----------------
  // Son las columnas de ajustes_leads_erroneos (fila 1): activo, limite_diario, exigir_captura y verificacion_ia.
  VISTAS.ajustes = function () {
    const a = datos.ajustes;
    if (!a.disponible) return '<div class="cabeza"><div><h1>Ajustes</h1></div></div>' + vacioHtml('No se pudieron leer los ajustes', 'Falta correr el SQL de leads erróneos en Supabase.');
    return '<div class="cabeza"><div><h1>Ajustes</h1><p class="sub">Reglas de los reportes de leads erróneos. Se aplican al momento para todo el equipo de Venezuela y Argentina.</p></div></div>' +
      '<form id="formAjustes" class="columna" novalidate>' +
      '<section class="bloque" aria-labelledby="tAjLE"><h2 id="tAjLE" style="margin-bottom:6px">Reportes de leads erróneos</h2>' +
      '<label class="interruptor" style="margin:10px 0 16px"><input type="checkbox" name="activo"' + (a.activo ? ' checked' : '') + '><span><b>Permitir reportar leads erróneos</b><br><span class="ayuda">Si lo apagas, nadie puede reportar hasta que lo vuelvas a encender.</span></span></label>' +
      '<label class="campo" style="max-width:240px"><span>Reportes por asesor al día</span><input class="entrada num" type="number" name="limiteDiario" value="' + a.limiteDiario + '" min="1" max="30" required></label>' +
      '<label class="interruptor" style="margin-top:16px"><input type="checkbox" name="exigirCaptura"' + (a.exigirCaptura ? ' checked' : '') + '><span><b>Exigir una captura como prueba</b><br><span class="ayuda">El reporte no se puede enviar sin la imagen del chat o de la llamada.</span></span></label>' +
      '<p class="ayuda" style="margin-top:12px">El límite según los leads que recibe cada asesor llega en la fase 2: necesita un cambio en el SQL.</p></section>' +
      '<section class="bloque" aria-labelledby="tAjIA"><h2 id="tAjIA" style="margin-bottom:6px">Revisión de capturas con IA</h2>' +
      '<p class="tenue" style="margin-bottom:14px;font-size:14px">La IA mira la captura de cada lead erróneo y dice si demuestra el motivo. Si lo confirma, el cupo se devuelve solo; si no, el reporte espera tu revisión.</p>' +
      '<fieldset class="modo-le"><legend class="sr">Revisión con IA</legend>' +
      '<label class="opcion"><input type="radio" name="verificacionIA" value="obligatoria"' + (a.verificacionIA === 'obligatoria' ? ' checked' : '') + '><span><b>Obligatoria</b><small>Ningún reporte se envía sin que la IA haya revisado su captura. Usa Claude Sonnet 5.5: unos 30 a 55 dólares al mes con 100 capturas diarias.</small></span></label>' +
      '<label class="opcion"><input type="radio" name="verificacionIA" value="apagada"' + (a.verificacionIA !== 'obligatoria' ? ' checked' : '') + '><span><b>Apagada</b><small>Funciona como antes: el reporte se aplica sin revisar la captura y supervisión lo revisa después.</small></span></label>' +
      '</fieldset><p class="ayuda" style="margin-top:10px">Ojo: también lo usa el panel actual. Si la enciendes, se enciende en los dos.</p></section>' +
      '<div><button type="submit" class="btn">Guardar ajustes</button></div></form>';
  };
  function pintarPreviaLE() { /* fase 1: sin vista previa (el límite es fijo) */ }
  // ======================================================
  // PANEL DEL LEAD
  // ======================================================
  let leadAbierto = null, pestanaLead = 'resumen', focoPrevio = null;

  function abrirLead(id, pestana) {
    const l = leadPorId(id); if (!l) return;
    if (!$('#cajon').classList.contains('abierto')) focoPrevio = document.activeElement;
    leadAbierto = l.id; pestanaLead = pestana || 'resumen';
    $('#cajon').innerHTML = '';
    pintarCajon();
    $('#cajon').classList.add('abierto'); $('#cajon').setAttribute('aria-hidden', 'false');
    $('#veloCajon').classList.add('abierto');
    setTimeout(() => { const t = $('#cajon .cerrar'); if (t) t.focus(); }, 60);
  }
  function cerrarCajon() {
    if (!$('#cajon').classList.contains('abierto')) return;
    const id = leadAbierto;
    $('#cajon').classList.remove('abierto'); $('#cajon').setAttribute('aria-hidden', 'true');
    $('#veloCajon').classList.remove('abierto');
    leadAbierto = null;
    // Si la lista se redibujó mientras el lead estaba abierto, el botón original
    // ya no existe: el foco vuelve a la fila nueva del mismo lead.
    const destino = (focoPrevio && document.contains(focoPrevio)) ? focoPrevio : $('#vista [data-accion="abrir-lead"][data-id="' + id + '"]');
    if (destino) destino.focus();
  }
  const puedeEditar = (l) => rol === 'asignador' || (rol === 'asesor' && l.asesorId === yo().id);

  function pintarCajon() {
    const l = leadPorId(leadAbierto); if (!l) { cerrarCajon(); return; }
    const editable = puedeEditar(l) && l.estado !== 'erroneo';
    const tel = l.tel.replace(/\D/g, '');
    const pasos = l.estado === 'perdido' || l.estado === 'erroneo'
      ? '<p style="margin-top:12px"><span class="estado-et" data-e="' + l.estado + '">' + NOMBRE_ESTADO[l.estado] + '</span></p>'
      : '<div class="pasos" role="group" aria-label="Estado del lead">' + ESTADOS.map(e => {
        const actual = e.id === l.estado, hecho = ORDEN[e.id] < ORDEN[l.estado];
        const bloqueado = (e.id === 'contactado' || e.id === 'cerrado') && faltaComprobante(l);
        return '<button type="button" data-accion="estado" data-valor="' + e.id + '" aria-pressed="' + actual + '"' + (hecho ? ' class="hecho"' : '') + (editable ? '' : ' disabled') +
          (bloqueado ? ' title="Primero sube la captura del primer contacto" aria-describedby="avisoCaptura"' : '') + '>' + (bloqueado ? '<span aria-hidden="true">🔒 </span>' : '') + e.nombre + '</button>';
      }).join('') + '</div>' +
      (editable && faltaComprobante(l) && l.estado === 'nuevo' ? '<p class="ayuda" id="avisoCaptura" style="margin-top:8px">Para marcarlo como Contactado sube la captura del primer contacto (más abajo): se pone en Contactado solo.</p>' : '');

    const fila = (k, v) => '<div class="linea-dato"><span class="tenue">' + k + '</span><span style="text-align:right">' + v + '</span></div>';
    const esMio = rol === 'asesor' && l.asesorId === yo().id;
    const cuerpo =
      (l.fechas ? fila('Fechas de viaje', esc(l.fechas)) : '') + (l.pax ? fila('Pasajeros', l.pax) : '') +
      ((l.origen || l.destino) ? fila('Ruta', esc((l.origen || '¿?') + ' a ' + (l.destino || '¿?'))) : '') +
      fila('Asesor', esc(usuario(l.asesorId).nombre)) + fila('Asignado', (esHoy(l.asignado) ? 'hoy ' : fmtDia(l.asignado) + ' ') + fmtHora(l.asignado) + ' <span class="muy-tenue">(' + hace(l.asignado) + ')</span>') +
      fila('Primer contacto', l.contactadoEn ? fmtHora(l.contactadoEn) + ' <span class="muy-tenue">(' + Math.max(0, Math.round((l.contactadoEn - l.asignado) / MIN)) + ' min después)</span>' : '<span style="color:var(--coral)">Todavía no</span>') +
      fila('Comprobante de contacto', l.comprobante ? 'Subido · <button type="button" class="btn btn-sec btn-chico" data-accion="ver-comprobante">Ver</button>' : '<span class="muy-tenue">Sin subir</span>') +
      (esMio && !l.comprobante && !['erroneo', 'perdido'].includes(l.estado)
        ? '<div class="zona-archivos" id="zonaArchivos" style="margin-top:16px"><p><b>Sube la captura del primer contacto</b></p><p class="ayuda" style="margin:4px 0 10px">Arrastra la imagen aquí o elígela. Con eso el lead queda como contactado y cuenta tu tiempo de respuesta.</p>' +
          '<button type="button" class="btn btn-sec btn-chico" data-accion="elegir-archivos">Elegir captura</button></div>' : '') +
      '<details style="margin-top:16px"><summary class="tenue" style="cursor:pointer;font-size:14px">Lo que llenó el cliente</summary><p style="white-space:pre-wrap;font-size:14px;margin-top:8px">' + esc(l.textoCliente) + '</p></details>';

    const c = rol === 'asesor' ? cupoLE(yo().id) : null;
    const reportesLead = datos.reportes.filter(r => r.leadId === l.id);
    const yaReportado = reportesLead.some(r => r.estado !== 'anulado');
    // Mismas reglas que el panel actual: solo antes del contacto, sin reporte anulado y si los reportes están encendidos.
    const contactado = l.comprobante || l.contactadoEn || l.estado === 'contactado';
    const puedeReportarLE = esMio && datos.ajustes.disponible && datos.ajustes.activo && !yaReportado && !reportesLead.some(r => r.estado === 'anulado') &&
      !contactado && !['cerrado', 'erroneo', 'perdido'].includes(l.estado);

    suave($('#cajon')).innerHTML =
      '<div class="cajon-cab"><div class="fila"><div><span class="ruta"><span class="ruta-cod" id="cajonTitulo">' + esc(codigo(l.origen)) + '</span>' + TRAYECTO.replace('class="trayecto"', 'class="trayecto" style="width:70px;height:18px"') + '<span class="ruta-cod">' + esc(codigo(l.destino)) + '</span></span>' +
        '<div class="muy-tenue" style="font-size:13px;margin-top:4px">Lead ' + l.id + ' · ' + esc(RUTAS[l.ruta] || l.ruta) + '</div></div>' +
        '<button type="button" class="btn-icono cerrar" data-accion="cerrar-cajon" aria-label="Cerrar el lead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>' +
        '<div class="cliente">' + esc(l.cliente) + '</div>' +
        '<div class="contacto"><span class="num">' + esc(telVisible(l.tel) || 'Sin teléfono') + '</span>' +
        (tel ? '<a class="btn btn-sec btn-chico" href="https://wa.me/' + esc(tel) + '" target="_blank" rel="noopener noreferrer">Abrir WhatsApp</a>' +
          '<button type="button" class="btn btn-sec btn-chico" data-accion="copiar-tel">Copiar número</button>' : '') + '</div>' + pasos + '</div>' +
      '<div class="cajon-cuerpo" id="cajonCuerpo">' + cuerpo + '</div>' +
      '<div class="cajon-pie">' + (esMio && !['cerrado', 'perdido', 'erroneo'].includes(l.estado) ? '<button type="button" class="btn btn-lima" data-accion="abrir-asistente" data-id="' + l.id + '">Pedir ayuda al asistente</button>' : '') +
      (editable && !['cerrado', 'perdido'].includes(l.estado) ? '<button type="button" class="btn btn-sec" data-accion="perdido">Marcar como perdido</button>' : '') +
      (puedeReportarLE ? '<button type="button" class="btn btn-peligro" data-accion="reportar-le"' + (c.quedan === 0 ? ' disabled title="Ya usaste todos tus reportes de hoy"' : '') + '>Reportar como erróneo (' + c.quedan + ' disponibles)</button>' : '') +
      (rol === 'asignador' ? '<button type="button" class="btn btn-peligro" data-accion="borrar-lead">Eliminar el lead</button>' : '') +
      (yaReportado ? '<span class="tenue" style="font-size:13.5px;align-self:center">Este lead ya fue reportado como erróneo.</span>'
        : esMio && contactado && !['cerrado', 'perdido', 'erroneo'].includes(l.estado) ? '<span class="muy-tenue" style="font-size:13px;align-self:center">Ya contactado: no se puede reportar como erróneo.</span>' : '') + '</div>';
    activarZonaArchivos();
  }

  // ---- Comprobante de contacto (igual que el panel actual: imagen chica en leads.foto_contacto_url) ----
  function activarZonaArchivos() {
    const zona = $('#zonaArchivos'); if (!zona || zona._activa) return;
    zona._activa = true;
    ['dragenter', 'dragover'].forEach(ev => zona.addEventListener(ev, e => { e.preventDefault(); zona.classList.add('encima'); }));
    ['dragleave', 'drop'].forEach(ev => zona.addEventListener(ev, e => { e.preventDefault(); zona.classList.remove('encima'); }));
    zona.addEventListener('drop', e => agregarArchivos(e.dataTransfer.files));
  }
  let subiendoComprobante = false;
  async function agregarArchivos(lista) {
    const l = leadPorId(leadAbierto); if (!l || !lista || !lista.length || subiendoComprobante) return;
    const f = lista[0];
    if (!/^image\//.test(f.type) && !/\.hei[cf]$/i.test(f.name || '')) { avisar('Sube una imagen (captura de pantalla PNG o JPG).', 'err'); return; }
    subiendoComprobante = true;
    const zona = $('#zonaArchivos'); if (zona) zona.innerHTML = '<p><b>Subiendo el comprobante…</b></p>';
    try {
      const dato = await comprimirImagen(f);
      if (dato.length > COMPROBANTE_MAX * 1.37) throw new Error('La imagen sigue siendo muy pesada. Haz una captura más pequeña.');
      const { data, error } = await sb.from('leads').update({ foto_contacto_url: dato, contactado_en: new Date().toISOString(), estado: 'contactado' }).eq('id', l.id).select('id');
      if (error) throw error;
      if (!data || !data.length) throw new Error('Supabase no dejó guardarlo: el lead no es tuyo o ya no es de hoy.');
      l.comprobante = true; l.contactadoEn = Date.now(); l.estado = 'contactado';
      avisar('Comprobante subido: el lead quedó como contactado.');
      repintar(); recargar();
    } catch (e) {
      avisar('No se subió el comprobante: ' + mensajeError(e), 'err'); pintarCajon();
    } finally { subiendoComprobante = false; }
  }
  // ======================================================
  // VENTANAS (modal)
  // ======================================================
  let focoAntesModal = null, alEnviarModal = null;
  function abrirModal(html, alEnviar) {
    focoAntesModal = document.activeElement;
    $('#modalCaja').innerHTML = html;
    alEnviarModal = alEnviar;
    $('#modal').classList.add('abierto');
    setTimeout(() => { const f = $('#modalCaja input:not([type=hidden]), #modalCaja select, #modalCaja textarea, #modalCaja button'); if (f) f.focus(); }, 40);
  }
  function cerrarModal() {
    if (!$('#modal').classList.contains('abierto')) return;
    $('#modal').classList.remove('abierto');
    $('#modalCaja').innerHTML = ''; alEnviarModal = null;
    if (focoAntesModal && document.contains(focoAntesModal)) focoAntesModal.focus();
  }
  const botonesModal = (texto, peligro) => '<div class="botones"><button type="button" class="btn btn-sec" data-accion="cerrar-modal">Cancelar</button><button type="submit" class="btn' + (peligro ? ' btn-peligro' : '') + '">' + texto + '</button></div>';
  function marcarError(form, nombre, mensaje) {
    const campo = form.elements[nombre];
    if (campo && campo.setAttribute) { campo.setAttribute('aria-invalid', 'true'); campo.focus(); }
    const p = $('.error-campo', form); if (p) { p.textContent = mensaje; p.classList.remove('oculto'); }
    return false;
  }

  // ---- Cambiar el estado de un lead (update con .select: 0 filas = Supabase no lo dejó) ----
  // El contacto se prueba con la captura: sin ella el lead no pasa a Contactado ni a Venta cerrada.
  // Solo para leads asignados desde que se publicó esta regla (5 nov 2026, 7:51 pm Caracas): los viejos siguen como antes.
  const COMPROBANTE_OBLIGATORIO_DESDE = Date.parse('2026-11-06T03:15:00-04:00');
  const faltaComprobante = (l) => l.asignado >= COMPROBANTE_OBLIGATORIO_DESDE && !l.comprobante && !l.contactadoEn;
  function pedirComprobante() {
    avisar('Primero sube la captura del primer contacto: es la prueba de que de verdad lo contactaste.', 'err');
    const zona = $('#zonaArchivos');
    if (zona) { zona.scrollIntoView({ block: 'center', behavior: 'smooth' }); zona.classList.remove('pide'); void zona.offsetWidth; zona.classList.add('pide'); }
    $('#selectorArchivos').value = ''; $('#selectorArchivos').click();
  }
  async function cambiarEstado(l, nuevo) {
    if ((nuevo === 'contactado' || nuevo === 'cerrado') && faltaComprobante(l)) throw new Error('primero sube la captura del primer contacto.');
    const { data, error } = await sb.from('leads').update({ estado: aEstadoBD(nuevo) }).eq('id', l.id).select('id');
    if (error) throw error;
    if (!data || !data.length) throw new Error('Supabase no dejó cambiarlo: el lead no es tuyo.');
    l.estado = nuevo;
    recargar();
  }

  // Fase 1: la venta se marca sin monto (la base aún no guarda ventas).
  function modalVenta(l) {
    abrirModal('<form class="formulario" novalidate><h2 id="modalTitulo">Marcar como venta cerrada</h2><p>' + esc(l.cliente) + ' · ' + esc(codigo(l.origen) + ' a ' + codigo(l.destino)) + '</p>' +
      '<p class="ayuda">El monto y el comprobante de pago se podrán guardar en la fase 2.</p>' +
      '<p class="error-campo oculto" role="alert"></p>' + botonesModal('Marcar como venta') + '</form>', async () => {
      await cambiarEstado(l, 'cerrado');
      avisar('Venta registrada.');
    });
  }
  function modalPerdido(l) {
    abrirModal('<form class="formulario" novalidate><h2 id="modalTitulo">Marcar como perdido</h2><p>El lead sale de tus activos y queda en el historial.</p>' +
      '<p class="error-campo oculto" role="alert"></p>' + botonesModal('Marcar como perdido', true) + '</form>', async () => {
      await cambiarEstado(l, 'perdido');
      avisar('Lead marcado como perdido.');
    });
  }

  // ---- Lead erróneo: misma secuencia que el panel actual ----
  // 1) Si la revisión con IA es obligatoria, la IA mira la captura y el asesor ve lo que dijo.
  // 2) Se envía con reportar_lead_erroneo (el servidor comprueba que la captura sea la misma revisada).
  const iaObligatoria = () => datos.ajustes.verificacionIA === 'obligatoria';
  function modalErroneo(l) {
    const c = cupoLE(yo().id);
    const conIA = iaObligatoria();
    const exige = datos.ajustes.exigirCaptura || conIA;
    let revision = null;      // { clave, ia } de la última captura revisada
    abrirModal('<form class="formulario" novalidate><h2 id="modalTitulo">Reportar como erróneo</h2><p>' + esc(l.cliente) + ' · ' + esc(telVisible(l.tel)) + '</p>' +
      '<div class="cupo-le" style="margin:0"><span class="num">' + c.quedan + '</span><span>reportes disponibles hoy de ' + c.limite + '. ' + esc(textoReglaLE()) + '</span></div>' +
      '<fieldset><legend class="sr">Motivo</legend><div class="opciones">' + Object.keys(MOTIVOS_LE).map((k, i) =>
        '<label class="opcion"><input type="radio" name="motivo" value="' + k + '"' + (i === 0 ? ' required' : '') + '><span>' + esc(MOTIVOS_LE[k]) + '</span></label>').join('') + '</div></fieldset>' +
      '<label class="campo"><span>Cuéntalo en una frase</span><textarea class="entrada" name="detalle" maxlength="500" placeholder="Ej.: le escribí y llamé, el número no tiene WhatsApp y la llamada no entra." required></textarea></label>' +
      '<label class="campo"><span>Captura como prueba' + (exige ? '' : ' (opcional)') + '</span><input class="entrada" type="file" name="captura" accept="image/*"' + (exige ? ' required' : '') + '></label>' +
      '<div class="resultado-ia oculto" role="status" aria-live="polite"></div>' +
      '<p class="ayuda">' + (conIA
        ? 'La IA revisa la captura y tu explicación antes de enviarlo. Si lo aprueba, se te devuelve el cupo en menos de un minuto y tu próximo lead es la reposición; si no, puedes probar con otra captura.'
        : 'Se te devuelve el cupo en menos de un minuto y tu próximo lead será la reposición. Supervisión puede anularlo.') + '</p>' +
      '<p class="error-campo oculto" role="alert"></p>' + botonesModal(conIA ? 'Revisar la captura' : 'Enviar el reporte', true) + '</form>', async (form) => {
      if (cupoLE(yo().id).quedan === 0) return marcarError(form, 'detalle', 'Ya usaste todos tus reportes de hoy.');
      const motivo = (form.querySelector('input[name="motivo"]:checked') || {}).value;
      if (!motivo) return marcarError(form, 'motivo', 'Elige qué pasa con el lead.');
      const detalle = form.detalle.value.trim();
      if (detalle.length < 8) return marcarError(form, 'detalle', 'Explica en una frase qué pasó (mínimo 8 letras).');
      const archivo = form.captura.files[0];
      if (exige && !archivo) return marcarError(form, 'captura', 'Adjunta la captura: es obligatoria.');

      const clave = motivo + '|' + (archivo ? archivo.name + archivo.size + archivo.lastModified : '');
      if (conIA && (!revision || revision.clave !== clave)) {
        const boton = form.querySelector('button[type="submit"]');
        const caja = form.querySelector('.resultado-ia');
        boton.textContent = 'Revisando la captura…';
        caja.className = 'resultado-ia revisando'; caja.textContent = 'La IA está mirando la captura. Tarda unos segundos.';
        const ia = await verificarCaptura(l, motivo, detalle, archivo);
        revision = { clave, ia };
        pintarResultadoIA(caja, ia, true);
        boton.textContent = ia.veredicto === 'confirma' ? 'Confirmar y enviar' : ia.veredicto === 'error' ? 'Enviar a supervisión' : 'Revisar otra captura';
        return false;
      }
      // La IA decide: si no lo aprobó, no se envía (solo si la IA falló, va a supervisión).
      if (conIA && revision && revision.ia.veredicto !== 'confirma' && revision.ia.veredicto !== 'error') {
        return marcarError(form, 'captura', 'La IA no aprobó este reporte. Elige otra captura que lo demuestre y se revisa otra vez.');
      }
      const r = await crearReporteLE(l, motivo, detalle, archivo, revision ? revision.ia : null);
      avisar(r.estado === 'en_revision' ? 'Reporte enviado a supervisión: la IA no pudo confirmarlo. Cuando lo aprueben se te devuelve el cupo.' : 'Reporte enviado. El reparto te devuelve el cupo en el próximo minuto.');
    });
    // Cambiar el motivo o la captura obliga a revisar de nuevo.
    const form = $('#modalCaja form');
    form.addEventListener('change', (e) => {
      if (!['motivo', 'captura'].includes(e.target.name) || !revision) return;
      revision = null;
      form.querySelector('.resultado-ia').className = 'resultado-ia oculto';
      form.querySelector('button[type="submit"]').textContent = 'Revisar la captura';
    });
  }

  // La función del servidor le enseña la captura a Claude Sonnet 5.5 y guarda la revisión.
  // Devuelve { veredicto, explicacion, loQueMuestra, verificacionId, captura } (la captura ya comprimida,
  // para mandar exactamente la misma imagen que se revisó).
  async function verificarCaptura(l, motivo, detalle, archivo) {
    let captura;
    try { captura = await comprimirEvidencia(archivo); }
    catch (e) { return { veredicto: 'error', explicacion: e.message, loQueMuestra: '' }; }
    try {
      const { data, error } = await sb.functions.invoke(FUNCION_IA_ERRONEOS, { body: { lead_id: l.id, motivo, detalle, captura } });
      if (error) {
        let msg = error.message;
        try { const cuerpo = await error.context.json(); if (cuerpo && cuerpo.error) msg = cuerpo.error; } catch (e2) { /* sin cuerpo */ }
        return { veredicto: 'error', explicacion: msg, loQueMuestra: '', captura };
      }
      if (!data || !data.ok) return { veredicto: 'error', explicacion: (data && data.error) || 'La revisión no respondió.', loQueMuestra: '', captura };
      return { veredicto: data.veredicto, explicacion: data.explicacion || '', loQueMuestra: data.lo_que_muestra || '', verificacionId: data.verificacion_id, captura };
    } catch (e) {
      return { veredicto: 'error', explicacion: mensajeError(e), loQueMuestra: '', captura };
    }
  }
  function pintarResultadoIA(caja, ia, conSiguientePaso) {
    caja.className = 'resultado-ia ' + (ia.veredicto === 'confirma' ? 'ok' : 'duda');
    caja.innerHTML = '<b>' + (ia.veredicto === 'confirma' ? 'La IA aprueba el reporte' : ia.veredicto === 'error' ? 'No se pudo revisar la captura' : 'La IA no aprueba el reporte') + '</b>' +
      '<span>' + esc(ia.explicacion) + '</span>' +
      (ia.loQueMuestra ? '<small>Lo que se ve: ' + esc(ia.loQueMuestra) + '</small>' : '') +
      (conSiguientePaso && ia.veredicto === 'error' ? '<small>Si lo envías así, queda en revisión de supervisión y el cupo se devuelve cuando lo aprueben.</small>'
        : conSiguientePaso && ia.veredicto !== 'confirma' ? '<small>Así no se puede enviar. Si tienes otra captura que lo demuestre, cámbiala y se revisa otra vez.</small>' : '');
  }

  // reportar_lead_erroneo valida en el servidor dueño, día, límite y (si hay) la revisión de la IA.
  async function crearReporteLE(l, motivo, detalle, archivo, ia) {
    let evidencia = ia && ia.captura ? ia.captura : null;
    if (!evidencia && archivo) evidencia = await comprimirEvidencia(archivo);
    const args = { p_lead_id: String(l.id), p_motivo: motivo, p_detalle: detalle, p_evidencia: evidencia };
    if (ia && ia.verificacionId) args.p_verificacion_id = ia.verificacionId;
    const { data, error } = await sb.rpc('reportar_lead_erroneo', args);
    if (error) throw error;
    const fila = Array.isArray(data) ? data[0] : data;
    l.estado = 'erroneo';
    recargar(300);
    return { estado: (fila && fila.estado) || (ia && ia.veredicto !== 'confirma' ? 'en_revision' : 'pendiente') };
  }

  function modalAnularLE(r) {
    abrirModal('<form class="formulario" novalidate><h2 id="modalTitulo">Anular el reporte</h2><p>' + esc(r.asesorNombre || usuario(r.asesorId).nombre) + ' verá esta nota. El lead vuelve a contar en su cupo.</p>' +
      '<label class="campo"><span>Por qué se anula</span><textarea class="entrada" name="nota" maxlength="300" required placeholder="Ej.: el número sí funciona, contestó a la primera."></textarea></label>' +
      '<p class="error-campo oculto" role="alert"></p>' + botonesModal('Anular el reporte', true) + '</form>', async (form) => {
      const nota = form.nota.value.trim();
      if (nota.length < 5) return marcarError(form, 'nota', 'Escribe el motivo para que el asesor lo entienda.');
      const { error } = await sb.rpc('anular_reporte_erroneo', { p_reporte_id: Number(r.id), p_nota: nota });
      if (error) throw error;
      avisar('Reporte anulado.'); recargar(200);
    });
  }
  function filtrarAsesoresPorRuta(form) {
    if (!form || !form.asesor) return;
    const disponibles = asesoresActivos(form.ruta.value).sort((a, b) => (b.enTurno - a.enTurno) || a.nombre.localeCompare(b.nombre));
    const previo = form.asesor.value;
    form.asesor.innerHTML = disponibles.length
      ? disponibles.map(a => '<option value="' + a.id + '"' + (a.id === previo ? ' selected' : '') + '>' + esc(a.nombre) + (a.enTurno ? ' · en turno' : '') + '</option>').join('')
      : '<option value="">Nadie atiende esta ruta</option>';
  }
  // Asignar a mano (solo asignadora): mismo insert que el panel actual. El texto sigue el formato del Apps Script.
  function modalLeadPropio() {
    if (rol !== 'asignador') return;
    abrirModal('<form class="formulario" novalidate><h2 id="modalTitulo">Asignar un lead a mano</h2>' +
      '<p>El lead entra en el panel del asesor al momento, con la hora de asignación. No se escribe en la hoja de reparto.</p>' +

      '<label class="campo"><span>Teléfono con prefijo</span><input class="entrada" name="tel" type="tel" required maxlength="20" placeholder="+57 300 123 4567" inputmode="tel"></label></div>' +
      '<div class="dos"><label class="campo"><span>Sale de</span><input class="entrada" name="origen" maxlength="40" placeholder="Bogotá"></label>' +
      '<label class="campo"><span>Va a</span><input class="entrada" name="destino" maxlength="40" placeholder="Madrid"></label></div>' +
      '<div class="dos"><label class="campo"><span>Ruta</span><select class="entrada" name="ruta">' + Object.keys(RUTAS).map(r => '<option value="' + r + '">' + RUTAS[r] + '</option>').join('') + '</select></label>' +
      '<label class="campo"><span>Asesor</span><select class="entrada" name="asesor"></select></label></div>' +

      for (const c of ['cliente', 'tel']) {

      }
      const digitos = form.tel.value.replace(/\D/g, '');
      if (digitos.length < 9 || digitos.length > 15) return marcarError(form, 'tel', 'El teléfono debe tener entre 9 y 15 dígitos, con el prefijo del país.');
      if (!form.asesor.value) return marcarError(form, 'asesor', 'Nadie atiende ' + RUTAS[form.ruta.value] + ' ahora. Asígnale esa ruta a alguien en “Asesores y rutas”.');
      const repetido = datos.leads.find(l => l.tel.replace(/\D/g, '').endsWith(digitos.slice(-9)));
      if (repetido) return marcarError(form, 'tel', 'Ese teléfono ya es un lead de ' + usuario(repetido.asesorId).nombre + ' (' + fmtDia(repetido.asignado) + ').');
      const partes = ['Nombre: ' + form.cliente.value.trim(), 'Teléfono: ' + form.tel.value.trim()];
      if (form.origen.value.trim()) partes.push('Origen: ' + form.origen.value.trim());
      if (form.destino.value.trim()) partes.push('Destino: ' + form.destino.value.trim());
      if (form.nota.value.trim()) partes.push('Observaciones: ' + form.nota.value.trim());
      const { data, error } = await sb.from('leads').insert({ cliente: partes.join('\n'), asesor_id: form.asesor.value, asignado_por: miId, fecha: hoyClave(), ruta: form.ruta.value }).select('id');
      if (error) throw error;
